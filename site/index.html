<title>Frontend Mastery — Lý thuyết & Thực hành</title>
<style>
  :root {
    --ground: #ffffff;
    --panel: #f7f8fb;
    --panel-2: #eef1f7;
    --ink: #1a2233;
    --ink-soft: #4a5568;
    --ink-faint: #8a93a6;
    --line: #e4e8f0;
    --line-strong: #d3d9e4;
    --warn: #d97706;
    --warn-bg: #fef6e7;
    --warn-line: #f4d58a;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --accent: #6366f1;
    --accent-soft: #eef0fe;
    --radius: 14px;
    --sidebar-w: 320px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    color: var(--ink);
    background: var(--ground);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
  }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    flex: 0 0 var(--sidebar-w);
    border-right: 1px solid var(--line);
    background: var(--ground);
    height: 100vh;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    z-index: 30;
  }
  .brand {
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand h1 {
    font-size: 17px;
    margin: 0;
    letter-spacing: -0.02em;
    font-weight: 800;
  }
  .brand .kicker {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 7px;
  }
  .progress-wrap { margin-top: 14px; }
  .progress-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .progress-row b { color: var(--ink); font-size: 12px; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #6366f1, #0ea5e9, #10b981, #f59e0b, #ec4899);
    border-radius: 99px; transition: width .4s ease;
  }

  .search { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .search input {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 9px;
    padding: 8px 11px; font-size: 13px; font-family: var(--font-sans);
    background: var(--panel); color: var(--ink); outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .nav { overflow-y: auto; padding: 10px 10px 40px; flex: 1; }
  .nav-level { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; padding: 15px 12px 5px; margin-top: 6px; border-top: 1px solid var(--line); }
  .nav-level:first-child { border-top: none; margin-top: 0; }
  .donebox { background: #edfcf3; border: 1px solid #b7eccb; border-left: 3px solid #16a34a; border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 18px; font-size: 15px; color: #14683a; }
  .nav-item { margin-bottom: 2px; }
  .phase-btn {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: none; border: none; cursor: pointer; text-align: left;
    padding: 9px 10px; border-radius: 9px; color: var(--ink); font-family: var(--font-sans);
    transition: background .15s;
  }
  .phase-btn:hover { background: var(--panel); }
  .phase-btn .dot { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; background: var(--pc, #ccc); }
  .phase-btn .pt { flex: 1; font-weight: 650; font-size: 13.5px; }
  .phase-btn .pn { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
  .phase-btn .chev { transition: transform .2s; color: var(--ink-faint); }
  .nav-item.open .chev { transform: rotate(90deg); }

  .lessons { display: none; padding: 2px 0 8px 28px; }
  .nav-item.open .lessons { display: block; }
  .lesson-btn {
    width: 100%; display: flex; align-items: center; gap: 9px;
    background: none; border: none; cursor: pointer; text-align: left;
    padding: 7px 10px; border-radius: 8px; color: var(--ink-soft);
    font-size: 12.5px; font-family: var(--font-sans); transition: background .15s, color .15s;
    position: relative;
  }
  .lesson-btn:hover { background: var(--panel); color: var(--ink); }
  .lesson-btn.active { background: var(--pc-soft, var(--panel-2)); color: var(--ink); font-weight: 650; }
  .lesson-btn.active::before {
    content: ""; position: absolute; left: -18px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 16px; border-radius: 3px; background: var(--pc, var(--accent));
  }
  .lesson-btn .ln { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); flex: 0 0 auto; }
  .lesson-btn .check {
    width: 15px; height: 15px; flex: 0 0 auto; border-radius: 50%;
    border: 1.5px solid var(--line-strong); display: grid; place-items: center;
  }
  .lesson-btn.done .check { background: var(--pc, var(--accent)); border-color: var(--pc, var(--accent)); }
  .lesson-btn.done .check svg { display: block; }
  .lesson-btn .check svg { display: none; }
  .lesson-btn.done .lt { color: var(--ink-faint); text-decoration: line-through; }
  .lesson-btn .lt { flex: 1; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; }
  .content { max-width: 820px; margin: 0 auto; padding: 46px 40px 120px; }
  .content.fade { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .topbar { display: none; }

  /* Lesson header */
  .lh-kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
    background: var(--accent-soft); padding: 5px 11px; border-radius: 99px;
  }
  .lh-kicker .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
  h2.lh-title {
    font-size: 33px; line-height: 1.15; letter-spacing: -0.025em; font-weight: 820;
    margin: 16px 0 0; text-wrap: balance;
  }

  section.block { margin-top: 34px; }
  .block-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 13px;
  }
  .block-ico {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
    display: grid; place-items: center; color: #fff;
  }
  .block-ico svg { width: 17px; height: 17px; }
  .block-head h3 {
    margin: 0; font-size: 12px; font-family: var(--font-mono); letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-soft); font-weight: 700;
  }

  .context {
    background: var(--accent-soft); border-left: 3px solid var(--accent);
    padding: 16px 20px; border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 15.5px; color: #2a3348;
  }

  ul.clean, ol.tasks { margin: 0; padding: 0; list-style: none; }
  ul.clean li {
    position: relative; padding: 6px 0 6px 28px; font-size: 15px; color: var(--ink-soft);
  }
  ul.clean li::before {
    content: ""; position: absolute; left: 4px; top: 13px;
    width: 8px; height: 8px; border-radius: 2px; background: var(--accent);
  }
  ol.tasks { counter-reset: t; display: flex; flex-direction: column; gap: 11px; }
  ol.tasks li {
    counter-increment: t; position: relative; padding: 13px 16px 13px 50px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    font-size: 14.5px; color: var(--ink);
  }
  ol.tasks li::before {
    content: counter(t); position: absolute; left: 13px; top: 12px;
    width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: #fff;
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
  }
  ol.tasks li code, ul.clean li code, .context code, .hints code, .crit label code {
    font-family: var(--font-mono); font-size: 0.86em; background: var(--panel-2);
    padding: 1.5px 5px; border-radius: 5px; color: #b23; word-break: break-word;
  }

  .hints {
    background: var(--panel); border: 1px dashed var(--line-strong); border-radius: var(--radius);
    padding: 16px 20px;
  }
  .hints ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .hints li { position: relative; padding-left: 24px; font-size: 14.5px; color: var(--ink-soft); }
  .hints li::before {
    content: "→"; position: absolute; left: 0; top: 0; color: var(--accent); font-weight: 700;
  }

  .crit { display: flex; flex-direction: column; gap: 9px; }
  .crit label {
    display: flex; gap: 11px; align-items: flex-start; cursor: pointer;
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14.5px; color: var(--ink); transition: background .15s, border-color .15s;
  }
  .crit label:hover { border-color: var(--line-strong); background: var(--panel); }
  .crit input { display: none; }
  .crit .box {
    width: 19px; height: 19px; flex: 0 0 auto; margin-top: 1px; border-radius: 6px;
    border: 1.7px solid var(--line-strong); display: grid; place-items: center; transition: .15s;
  }
  .crit .box svg { width: 12px; height: 12px; opacity: 0; color: #fff; }
  .crit input:checked + .box { background: #16a34a; border-color: #16a34a; }
  .crit input:checked + .box svg { opacity: 1; }
  .crit input:checked ~ .txt { color: var(--ink-faint); text-decoration: line-through; }

  .traps {
    background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: var(--radius);
    padding: 16px 20px;
  }
  .traps ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .traps li { position: relative; padding-left: 26px; font-size: 14.5px; color: #7c4a08; }
  .traps li::before {
    content: "!"; position: absolute; left: 0; top: 0; width: 17px; height: 17px;
    background: var(--warn); color: #fff; border-radius: 5px; font-family: var(--font-mono);
    font-size: 11px; font-weight: 800; display: grid; place-items: center;
  }

  .mark-done {
    margin-top: 40px; display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel);
  }
  .mark-done button {
    font-family: var(--font-sans); font-size: 14px; font-weight: 650; cursor: pointer;
    border: none; padding: 10px 18px; border-radius: 9px; background: var(--accent); color: #fff;
    transition: filter .15s, transform .05s;
  }
  .mark-done button:hover { filter: brightness(1.05); }
  .mark-done button:active { transform: translateY(1px); }
  .mark-done.is-done button { background: #16a34a; }
  .mark-done .hint { font-size: 13px; color: var(--ink-faint); }

  .lesson-nav {
    margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 14px;
  }
  .lesson-nav a {
    flex: 1; text-decoration: none; color: var(--ink); border: 1px solid var(--line);
    border-radius: 11px; padding: 13px 16px; transition: border-color .15s, background .15s;
    cursor: pointer;
  }
  .lesson-nav a:hover { border-color: var(--line-strong); background: var(--panel); }
  .lesson-nav a.next { text-align: right; }
  .lesson-nav .dir { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .lesson-nav .nm { font-weight: 650; font-size: 14px; margin-top: 3px; }
  .lesson-nav a.disabled { opacity: 0; pointer-events: none; }

  /* ---------- Home ---------- */
  .hero-kicker {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .hero h2 {
    font-size: 42px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 830;
    margin: 14px 0 0; text-wrap: balance;
  }
  .hero h2 .grad {
    background: linear-gradient(100deg, #6366f1, #0ea5e9, #10b981, #f59e0b, #ec4899);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { font-size: 17px; color: var(--ink-soft); margin: 18px 0 0; max-width: 60ch; }

  .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 34px; }
  .rule {
    border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  }
  .rule .n { font-family: var(--font-mono); font-size: 11px; color: var(--accent); font-weight: 700; }
  .rule .t { font-weight: 700; font-size: 14.5px; margin: 6px 0 4px; letter-spacing: -0.01em; }
  .rule .d { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }

  .phase-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 22px; }
  .pcard {
    border: 1px solid var(--line); border-radius: 14px; padding: 20px; cursor: pointer;
    background: var(--ground); transition: transform .12s, box-shadow .2s, border-color .2s;
    position: relative; overflow: hidden;
  }
  .pcard::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--pc);
  }
  .pcard:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -14px rgba(30,40,70,.28); border-color: var(--pc); }
  .pcard .pnum { font-family: var(--font-mono); font-size: 12px; color: var(--pc); font-weight: 700; }
  .pcard h3 { margin: 8px 0 4px; font-size: 18px; letter-spacing: -0.02em; }
  .pcard .sub { font-size: 13px; color: var(--ink-soft); }
  .pcard .cnt { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top: 12px; }

  .section-title {
    font-size: 13px; font-family: var(--font-mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-faint); margin: 46px 0 4px; font-weight: 700;
  }
  .proj {
    margin-top: 20px; border: 1px solid var(--line); border-radius: 16px; padding: 24px;
    background: linear-gradient(135deg, #fafbff, #f4f7ff);
  }
  .proj h3 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.02em; }
  .proj p { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 16px; }
  .ms { display: flex; flex-direction: column; gap: 8px; }
  .ms-row { display: flex; gap: 12px; align-items: baseline; font-size: 14px; }
  .ms-row .mn { font-family: var(--font-mono); font-size: 11px; color: #fff; background: var(--ink); padding: 2px 8px; border-radius: 6px; flex: 0 0 auto; }
  .ms-row .md { color: var(--ink-soft); }
  .ms-row .md b { color: var(--ink); font-weight: 700; }

  /* ---------- Mobile ---------- */
  .backdrop { display: none; }
  .hamburger { display: none; }
  @media (max-width: 900px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%);
      transition: transform .25s ease; box-shadow: 0 0 60px rgba(0,0,0,.2);
    }
    .app.nav-open .sidebar { transform: none; }
    .backdrop {
      display: block; position: fixed; inset: 0; background: rgba(20,26,40,.4);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 25;
    }
    .app.nav-open .backdrop { opacity: 1; pointer-events: auto; }
    .topbar {
      display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line); padding: 12px 18px;
    }
    .hamburger {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px;
      border: 1px solid var(--line-strong); background: var(--ground); cursor: pointer;
    }
    .topbar .tt { font-weight: 750; font-size: 15px; }
    .content { padding: 28px 22px 100px; }
    .rules { grid-template-columns: 1fr; }
    .phase-grid { grid-template-columns: 1fr; }
    .hero h2 { font-size: 32px; }
  }
</style>

  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar">
    <div class="brand">

<script>
const ICON = {
  ctx:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>',
  goal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>',

};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>';
const CHECK_SM = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2"><path d="M4 12l5 5L20 6"/></svg>';

const PHASES = [
  { num: "00", title: "JS & Browser Foundations", sub: "Event loop, memory, async — nền tảng chắc",
    color: "#6366f1", soft: "#eef0fe",
    lessons: [
      { n: "00.01", title: "Event Loop thực sự",
        ctx: "Sếp báo: “Trang đơ 2 giây mỗi khi bấm Export.” Nguyên nhân là một vòng lặp nặng chạy đồng bộ. Để hiểu vì sao nó đơ cả UI và cách sửa, bạn phải hiểu event loop — trái tim của mọi thứ chạy trong browser.",
        goals: ["Hiểu call stack, task queue (macrotask), microtask queue", "Thứ tự thực thi: đồng bộ → microtask → macrotask", "requestAnimationFrame và requestIdleCallback xen vào đâu", "Vì sao code đồng bộ nặng làm đơ UI (block main thread)"],
        tasks: ["Đoán output đoạn <code>console.log('1'); setTimeout(()=>log('2'),0); Promise.resolve().then(()=>log('3')); console.log('4')</code> trước, rồi chạy kiểm chứng. Giải thích vì sao là <code>1 4 3 2</code>.", "Thêm case khó: lồng <code>Promise.then</code> trong <code>setTimeout</code> và ngược lại. Đoán → chạy → giải thích.", "Trong browser: nút bấm chạy <code>for</code> 3 tỷ vòng. Quan sát UI freeze (không scroll/click được).", "Vẽ sơ đồ: call stack, microtask queue, macrotask queue và luồng một tick."],
        hints: ["Sau MỖI macrotask, event loop rút cạn TOÀN BỘ microtask queue trước khi qua macrotask kế.", "<code>await x</code> ≈ <code>.then()</code> — phần sau await là một microtask.", "requestAnimationFrame chạy ngay trước lần paint kế (~mỗi 16ms ở 60fps)."],
        crit: ["Đoán đúng output của 3 đoạn code trộn async khác nhau", "Giải thích được bằng lời tại sao microtask chạy trước macrotask", "Vẽ và thuyết trình sơ đồ event loop trong 2 phút"],
        traps: ["Nghĩ <code>setTimeout(fn,0)</code> chạy ngay — không, nó vào macrotask, chờ hết microtask.", "Nghĩ Promise chạy song song — JS đơn luồng, Promise chỉ lập lịch callback.", "Quên main thread lo cả JS lẫn rendering → code nặng đồng bộ = UI freeze."] },
      { n: "00.02", title: "Memory, Reference & Closure Leaks",
        ctx: "App mở cả ngày càng lúc càng chậm, tab ngốn 2GB rồi crash. Gần như luôn là memory leak. Muốn tìm và sửa, phải hiểu JS quản lý bộ nhớ thế nào và closure giữ reference ra sao.",
        goals: ["Phân biệt stack (primitive) vs heap (object/reference)", "Hiểu “pass by value” vs “pass by reference” thực chất", "Closure giữ reference tới scope ngoài → nguồn leak", "Dùng Chrome DevTools Memory panel (heap snapshot)"],
        tasks: ["Chứng minh: gán object rồi sửa property ảnh hưởng cả hai biến; primitive thì không. Giải thích bằng mô hình stack/heap.", "Tạo leak cố ý: listener capture một mảng lớn <code>bigData</code>, gọi nhiều lần, chụp heap snapshot xem bộ nhớ tăng không giảm.", "Sửa leak: <code>removeEventListener</code> đúng cách, hoặc không capture <code>bigData</code>.", "Liệt kê 4 nguồn leak FE: listener không gỡ, timer không clear, detached DOM node, biến toàn cục vô tình."],
        hints: ["Heap snapshot: chụp trước → hành động → chụp sau → so sánh objects allocated.", "“Detached DOM tree” trong snapshot là dấu hiệu kinh điển của leak.", "GC chỉ dọn object không còn ai reference. Closure = còn reference."],
        crit: ["Giải thích reference vs value bằng sơ đồ stack/heap", "Tạo được leak, thấy trong Memory panel, rồi sửa và chứng minh đã hết", "Kể được 4 nguồn leak và cách phòng mỗi loại"],
        traps: ["Quên <code>clearInterval/clearTimeout</code> khi component unmount.", "Trong React: đăng ký listener trong <code>useEffect</code> nhưng không return cleanup.", "Giữ reference tới DOM node đã bị remove → detached node leak."] },
      { n: "00.03", title: "Async sâu",
        ctx: "Bạn gọi 5 API để dựng dashboard. Có cái phụ thuộc nhau, có cái độc lập. Gọi sai cách → trang tải chậm gấp 3, và một API lỗi làm sập cả trang. Cần làm chủ async để orchestrate đúng.",
        goals: ["Async/await chỉ là đường cú pháp trên Promise", "Chọn đúng: tuần tự vs song song", "Phân biệt Promise.all / allSettled / race / any", "Xử lý lỗi async đúng cách"],
        tasks: ["Tạo hàm giả lập API (Promise trả sau 500–1500ms).", "Gọi 3 API độc lập theo 2 cách: <code>await</code> tuần tự vs <code>Promise.all</code>. Đo thời gian, giải thích chênh lệch.", "1 API fail: so sánh <code>Promise.all</code> (reject hết) vs <code>allSettled</code> (báo từng cái). Khi nào dùng cái nào?", "Viết <code>fetchWithTimeout(promise, ms)</code> dùng <code>Promise.race</code>.", "Bọc try/catch đúng chỗ để 1 API lỗi không crash cả app."],
        hints: ["API độc lập → luôn song song. API phụ thuộc → tuần tự.", "<code>allSettled</code> không bao giờ reject — trả mảng {status, value|reason}.", "<code>race</code> theo cái xong trước; <code>any</code> chỉ quan tâm cái resolve đầu tiên."],
        crit: ["Đo và giải thích chênh lệch tuần tự vs song song", "Chọn đúng combinator cho từng tình huống", "Có fetchWithTimeout chạy đúng"],
        traps: ["<code>await</code> trong <code>for</code> với call độc lập = tự làm chậm.", "Quên Promise.all fail-fast: 1 reject mất hết.", "Nuốt lỗi (empty catch) → bug ẩn."] },
      { n: "00.04", title: "Debounce & Throttle (tự viết)",
        ctx: "Ô search gọi API mỗi ký tự → 20 request cho 1 từ khóa. Scroll chạy handler 100 lần/giây → giật. Hai vũ khí kinh điển: debounce và throttle. Tự viết để hiểu tận gốc.",
        goals: ["Khác biệt bản chất giữa debounce và throttle", "Tự implement cả hai bằng closure + timer", "Biết chọn cái nào cho tình huống nào"],
        tasks: ["Viết <code>debounce(fn, delay)</code> — chỉ chạy sau khi ngừng gọi delay ms.", "Viết <code>throttle(fn, interval)</code> — chạy tối đa 1 lần mỗi interval.", "Demo: input dùng debounce, scroll dùng throttle. Đếm số lần handler chạy vs số event.", "Nâng cao: thêm option leading/trailing cho debounce."],
        hints: ["Debounce: mỗi lần gọi thì clearTimeout cái cũ rồi setTimeout cái mới.", "Throttle: giữ flag/timestamp, bỏ qua các lần gọi trong interval.", "Giữ đúng <code>this</code> và arguments: <code>fn.apply(this, args)</code>."],
        crit: ["Debounce & throttle tự viết chạy đúng, không thư viện", "Demo cho thấy số lần handler chạy giảm rõ rệt", "Giải thích: search dùng debounce, scroll/resize dùng throttle"],
        traps: ["Định nghĩa timer/flag ngoài closure → dùng chung mọi instance (sai).", "Debounce cho scroll → UI không phản hồi tới khi ngừng scroll.", "Quên cleanup timer khi unmount (leak)."] },
    ]},
  { num: "01", title: "How the Browser Works", sub: "Rendering path, reflow/repaint, layers, loading",

        goals: ["5 bước: DOM → CSSOM → Render Tree → Layout → Paint → Composite", "Mỗi bước tốn gì và cái gì chặn nó", "Vì sao CSS render-blocking còn JS parser-blocking"],

      { n: "01.02", title: "Reflow vs Repaint vs Composite",
        ctx: "Một animation giật cục. Trang khác lag khi thêm 100 item. Cả hai do bạn vô tình bắt browser làm lại việc đắt tiền: reflow. Bài học “tiền” của mọi tối ưu runtime.",

        hints: ["Đọc geometry (offsetHeight, getBoundingClientRect) sau khi vừa ghi style → buộc reflow đồng bộ.", "<code>transform</code> và <code>opacity</code> chỉ chạy ở Composite (GPU) → rẻ nhất.", "Đổi width/height/top/left/margin → reflow. Đổi color/background/box-shadow → repaint."],

        goals: ["Compositor layer là gì, khi nào browser tách layer", "Vì sao transform/opacity animation mượt (chạy compositor thread)", "Dùng will-change đúng liều và tác hại khi lạm dụng"],

        ctx: "Dashboard cần cache hàng nghìn dòng để xem offline. localStorage không đủ (~5MB, đồng bộ, chỉ string). Giải pháp đúng: IndexedDB — database async trong browser, lưu object/blob dung lượng lớn.",
        goals: ["Chọn: localStorage vs sessionStorage vs IndexedDB vs Cache API", "Object store, key, index, transaction, versioning", "Dùng IndexedDB thô một lần, rồi qua wrapper idb"],
        tasks: ["Bảng so sánh 4 kiểu lưu trữ: dung lượng, đồng bộ/bất đồng bộ, kiểu dữ liệu, use case.", "Dùng API thô: mở DB, tạo object store + index, CRUD record. Chịu đau với event-based API để hiểu bản chất.", "Viết lại bằng thư viện <code>idb</code> (Promise wrapper), so sánh độ dễ đọc.", "Versioning: bump version, thêm index mới trong <code>onupgradeneeded</code>, xử lý migration.", "Áp dụng: cache dữ liệu bảng dashboard vào IndexedDB."],
        hints: ["localStorage đồng bộ → block main thread; chỉ hợp dữ liệu nhỏ (token, setting).", "IndexedDB bất đồng bộ, transaction-based; index cho query nhanh theo field.", "idb của Jake Archibald làm IndexedDB dễ thở hơn nhiều."],
        crit: ["Bảng so sánh lưu trữ và giải thích chọn cái nào khi nào", "CRUD được với IndexedDB thô lẫn idb", "Xử lý versioning/migration không mất dữ liệu"],
        traps: ["Lưu dữ liệu lớn vào localStorage → block main thread, tràn quota.", "Quên transaction tự đóng khi hết microtask → lỗi transaction is not active.", "Không xử lý onupgradeneeded cho user version cũ → crash."] },
      { n: "03.02", title: "Service Worker & Offline (PWA)",
        ctx: "User dashboard đi tàu điện, mất mạng liên tục. Yêu cầu: app vẫn mở được, xem được dữ liệu đã tải. Service Worker là proxy giữa app và network. ⚠️ Đây là API dễ gây tai nạn production nhất — cấu hình sai có thể khóa user ở bản cũ.",
        goals: ["Lifecycle: install → activate → fetch; và vấn đề update", "Caching strategies: cache-first, network-first, stale-while-revalidate", "Biến app thành PWA installable, chạy offline"],
        tasks: ["Đăng ký SW tối giản, quan sát lifecycle trong Application → Service Workers.", "Cache app shell trong <code>install</code>, phục vụ cache-first khi <code>fetch</code>. Tắt mạng, xác nhận app vẫn load.", "API data: áp dụng stale-while-revalidate, kết hợp IndexedDB từ 03.01.", "Update flow: sửa SW, quan sát waiting state, hiểu <code>skipWaiting</code> + <code>clients.claim</code> và rủi ro.", "Thêm <code>manifest.json</code> để installable. Làm lại caching bằng Workbox, so sánh."],
        hints: ["Cache-first: nhanh nhưng dễ phục vụ đồ cũ → hợp asset có hash trong tên.", "Network-first: luôn mới nếu có mạng → hợp dữ liệu quan trọng.", "Stale-while-revalidate: cân bằng tốc độ + độ mới → hợp phần lớn API data."],
        crit: ["App load được khi offline (app shell + dữ liệu cache)", "Áp dụng đúng 3 chiến lược cache cho 3 loại resource", "Giải thích update flow và cách tránh khóa user ở bản cũ"],
        traps: ["Cache-first cho HTML gốc → user kẹt bản cũ mãi dù đã deploy.", "skipWaiting bừa bãi → SW mới tiếp quản giữa chừng, asset không khớp.", "Quên dọn cache cũ trong activate → phình storage.", "Test SW trên file:// (không chạy) — cần HTTPS hoặc localhost."] },
      { n: "03.03", title: "WebSocket & Real-time",
        ctx: "Dashboard cần cập nhật giá/thông báo tức thời. Polling mỗi giây lãng phí và trễ. WebSocket cho kết nối 2 chiều real-time. Phần khó nhất: reconnect bền bỉ khi mạng rớt.",
        goals: ["Chọn đúng: WebSocket vs SSE vs polling", "Vòng đời connection và các event", "Tự viết lớp reconnect (exponential backoff) + heartbeat", "Cleanup đúng khi unmount / tab ẩn"],
        tasks: ["Bảng so sánh WebSocket / SSE / long-polling. Khi nào nên SSE thay vì WebSocket?", "Kết nối echo server, gửi/nhận message, log lifecycle.", "Viết class <code>ReconnectingSocket</code>: tự reconnect khi close với backoff (1s,2s,4s… trần ~30s); heartbeat ping/pong phát hiện chết; hàng đợi message flush khi kết nối lại.", "Tích hợp React: hook <code>useSocket</code>, cleanup trong useEffect return.", "Tab ẩn: dùng Page Visibility API giảm hoạt động khi tab nền."],
        hints: ["SSE (EventSource) đơn giản hơn cho luồng 1 chiều server→client, tự reconnect sẵn.", "Backoff phải có jitter (random nhỏ) tránh thundering herd.", "Heartbeat phát hiện half-open connection mà event close không bắn."],
        crit: ["ReconnectingSocket tự hồi phục sau khi tắt/bật mạng, có backoff + jitter", "Heartbeat phát hiện kết nối chết", "Hook React cleanup sạch, không leak khi unmount"],
        traps: ["Reconnect ngay không backoff → spam server, tự DDoS.", "Quên clear heartbeat timer khi reconnect → nhiều timer chồng nhau.", "Không cleanup socket khi unmount → connection ma + leak.", "Tin onclose luôn bắn khi mất mạng — không phải; cần heartbeat."] },
    ]},
  { num: "04", title: "MUI Theming & Design System", sub: "Theme, customization, dark mode, tokens",
    color: "#ec4899", soft: "#fdeaf4",
    lessons: [
      { n: "04.01", title: "Theme Structure",
        ctx: "Mỗi dev tự chế màu, spacing, font riêng → UI loạn, sửa 1 màu phải grep 200 chỗ. Giải pháp: một theme tập trung là nguồn chân lý duy nhất.",
        goals: ["Các nhánh theme: palette, typography, spacing, breakpoints, shadows, transitions, zIndex, shape", "createTheme + ThemeProvider và cách truy cập theme", "Spacing scale và breakpoints thay vì hardcode px"],
        tasks: ["Tạo <code>theme.ts</code>: palette, typography, spacing, breakpoints. Bọc app bằng ThemeProvider.", "Trang demo dùng CHỈ giá trị theme (<code>theme.spacing(2)</code>, <code>palette.primary.main</code>) — không hardcode.", "Đổi 1 giá trị (primary color), xác nhận toàn app đổi theo.", "Dùng <code>useTheme()</code> và <code>useMediaQuery(theme.breakpoints.down('md'))</code> làm responsive."],

      { n: "04.02", title: "Component Customization đúng cách",

        goals: ["Phân biệt sx prop, styled(), theme.components", "Dùng cái nào khi nào và chi phí runtime", "Tạo custom variant qua theme"],
        tasks: ["Style cùng một Button bằng 3 cách: sx, styled(), styleOverrides. Ghi khác biệt về tái sử dụng.", "Trong theme.components thêm <code>defaultProps</code> và <code>styleOverrides</code> áp mọi Button.", "Tạo custom variant (<code>variant=\"dashed\"</code>) qua <code>theme.components.MuiButton.variants</code>.", "Viết guideline: khi nào sx / styled / theme.components cho team."],
        hints: ["sx: nhanh, cục bộ, nhưng rải rác → khó bảo trì nếu lặp.", "styled(): tạo component tái dùng có style gắn liền.", "theme.components: áp toàn cục + tạo variant → nguồn chân lý.", "Emotion có chi phí runtime; MUI đang dịch hướng zero-runtime."],
        crit: ["Làm được cùng 1 style bằng cả 3 cách và giải thích trade-off", "Tạo custom variant qua theme và dùng lại", "Có guideline dùng cách nào khi nào"],
        traps: ["Lạm dụng sx cho style lặp → nên nâng lên theme.components.", "Đè bằng CSS specificity thay vì qua theme → dễ vỡ khi MUI update.", "Định nghĩa styled() trong render → tạo lại component mỗi lần, mất state."] },
      { n: "04.03", title: "Dark Mode với CSS Variables",
        ctx: "Khách yêu cầu dark mode. Cách cũ (đổi theme object) làm re-render toàn cây và nhấp nháy. MUI hỗ trợ CSS variables mode để chuyển theme không re-render, không flash.",

        tasks: ["Bật CSS variables, định nghĩa <code>colorSchemes: { light, dark }</code>.", "Nút toggle dùng <code>useColorScheme()</code>, quan sát không re-render toàn cây.", "Xử lý FOUC: áp mode sớm trước hydrate (InitColorSchemeScript).", "Tôn trọng prefers-color-scheme mặc định, lưu lựa chọn vào localStorage.", "Mở DevTools xem CSS variables <code>--mui-palette-…</code> đổi khi toggle."],
        hints: ["CSS variables mode: đổi theme = đổi giá trị biến CSS, browser tự repaint.", "Lưu preference vào localStorage giữ lựa chọn qua các lần vào.", "FOUC xử lý bằng cách set mode trên <code>&lt;html&gt;</code> trước paint đầu."],
        crit: ["Toggle dark mode mượt, không nhấp nháy, không re-render toàn cây", "Tôn trọng prefers-color-scheme + nhớ lựa chọn user", "Xem được CSS variables đổi trong DevTools"],

        traps: ["Component dùng thẳng primitive → đổi brand phải sửa component (thất bại).", "Trộn semantic và primitive → mất nhất quán.", "Tạo quá nhiều token semantic không ai dùng → rối."] },

  { num: "05", title: "Security & Maintainability", sub: "XSS/CSP, auth/CORS, testing, observability/CI",
    color: "#ef4444", soft: "#fdeaea",
    lessons: [
      { n: "05.01", title: "XSS & Content Security Policy",
        ctx: "Dashboard hiển thị comment/tên do user nhập. Kẻ xấu nhập <code>&lt;script&gt;đánh cắp cookie&lt;/script&gt;</code>. Nếu render thẳng, script chạy trên trình duyệt nạn nhân → XSS, lỗ hổng phổ biến nhất ở FE.",
        goals: ["3 loại XSS: stored, reflected, DOM-based", "Phòng: output encoding, sanitize, tránh dangerouslySetInnerHTML", "Content Security Policy làm lớp phòng thủ chiều sâu"],
        tasks: ["Tạo lỗ hổng XSS cố ý bằng <code>dangerouslySetInnerHTML</code>, nhập payload <code>&lt;img src=x onerror=alert(1)&gt;</code>, xác nhận chạy.", "Sửa: (a) để React tự escape, (b) nếu buộc render HTML thì sanitize bằng DOMPurify.", "Cấu hình CSP header chặn inline script, chỉ cho phép origin tin cậy. Quan sát CSP chặn payload.", "Liệt kê nơi dữ liệu không tin cậy chảy vào: URL params, localStorage, postMessage, API response."],
        hints: ["React tự escape khi render <code>{userInput}</code> — đừng phá bằng dangerouslySetInnerHTML.", "CSP không thay thế sanitize; là lớp phòng thủ khi sanitize sót.", "<code>href=\"javascript:…\"</code> cũng là vector XSS — validate URL scheme."],
        crit: ["Tái hiện XSS rồi vá bằng cả escape lẫn DOMPurify", "CSP chặn được inline script (thấy log vi phạm)", "Liệt kê các nguồn dữ liệu không tin cậy trong app"],
        traps: ["Dùng dangerouslySetInnerHTML với dữ liệu user mà không sanitize.", "Tin dữ liệu từ URL/localStorage/API là an toàn.", "CSP quá lỏng (unsafe-inline) → coi như không có CSP."] },
      { n: "05.02", title: "Auth an toàn, CORS & CSRF",
        ctx: "Bạn lưu JWT vào localStorage vì tiện. Rồi một lỗ hổng XSS nhỏ để lộ toàn bộ token → mất tài khoản user. Lưu token ở đâu và bảo vệ request thế nào là quyết định bảo mật quan trọng.",
        goals: ["Trade-off lưu token: localStorage vs httpOnly cookie", "CORS thực chất là gì (bảo vệ, không phải rào cản để tắt)", "CSRF và SameSite cookie"],
        tasks: ["Bảng trade-off localStorage (dễ bị XSS lấy) vs httpOnly cookie (chống XSS đọc, cần chống CSRF). Kết luận cách nào an toàn hơn.", "Demo CORS: gọi API khác origin, quan sát preflight OPTIONS và header Access-Control-Allow-*.", "Mô phỏng CSRF: vì sao cookie tự gửi kèm request bị lợi dụng; SameSite=Lax/Strict chặn thế nào.", "Checklist auth an toàn: không log token, refresh flow, logout xóa sạch, không tin claim client-side."],
        hints: ["httpOnly cookie: JS không đọc được → XSS khó lấy; nhưng cần chống CSRF.", "CORS do trình duyệt thực thi để bảo vệ user; “tắt CORS” ở FE là hiểu sai — phải cấu hình server.", "FE không bao giờ là nơi thực thi bảo mật cuối; server luôn verify lại."],
        crit: ["Giải thích vì sao httpOnly cookie thường an toàn hơn localStorage cho token", "Đọc preflight CORS và giải thích lỗi CORS đúng bản chất", "Hiểu CSRF và vai trò của SameSite"],
        traps: ["Lưu token nhạy cảm vào localStorage rồi có XSS → mất sạch.", "“Tắt CORS” bằng proxy bừa hoặc mode:no-cors — hiểu sai vấn đề.", "Tin role/permission phía client để ẩn UI mà không có server verify → bypass dễ."] },
      { n: "05.03", title: "Testing (Unit / Component / E2E)",
        ctx: "Mỗi lần sửa 1 chỗ lại vỡ 3 chỗ khác mà không ai biết cho tới khi user report. Test tự động là lưới an toàn để refactor tự tin. Bài này học test cái gì ở tầng nào.",
        goals: ["Testing pyramid: nhiều unit, vừa component, ít e2e", "Viết unit (Vitest), component (Testing Library), e2e (Playwright)", "Test hành vi người dùng, không test chi tiết cài đặt"],
        tasks: ["Unit (Vitest): test hàm thuần đã viết (debounce, backoff, format). Cover edge case.", "Component (RTL): render, tương tác (click/type), assert theo cái user thấy (<code>getByRole</code>, <code>getByText</code>).", "E2E (Playwright): 1 flow thật — mở app, filter bảng, thấy kết quả. Chạy headless.", "Cố tình gây regression, xác nhận test bắt được."],
        hints: ["RTL triết lý: test như người dùng dùng, truy vấn theo role/label.", "Unit cho logic, component cho UI + tương tác, e2e cho luồng nghiệp vụ quan trọng.", "Đừng chạy theo 100% coverage — cover phần rủi ro cao, giá trị cao."],
        crit: ["Có unit + component + e2e test chạy xanh", "Test bắt được regression khi cố tình phá", "Giải thích test nào thuộc tầng nào và vì sao"],
        traps: ["Test chi tiết cài đặt (state, tên hàm nội bộ) → refactor là vỡ test.", "Quá nhiều e2e (chậm, flaky) thay vì đẩy xuống unit/component.", "Mock quá đà đến mức test không phản ánh thực tế."] },
      { n: "05.04", title: "Observability & CI/CD",
        ctx: "App lỗi trên máy user nhưng bạn không tái hiện được, không có log. Mỗi lần deploy là hồi hộp vì không có gì chặn code lỗi lên production. Bài này khép vòng: quan sát lỗi thật + cổng chất lượng tự động.",
        goals: ["Bắt và báo cáo lỗi runtime (Error Boundary + error tracking)", "Đo Web Vitals của user thật (field data)", "CI gate: lint + typecheck + test + build"],
        tasks: ["Thêm Error Boundary: component con throw thì hiện fallback thay vì màn trắng, log lỗi ra endpoint.", "Bắt lỗi async toàn cục: <code>window.onerror</code>, <code>onunhandledrejection</code>.", "Cài web-vitals, gửi LCP/INP/CLS thật của user về endpoint (RUM), đối chiếu với lab data.", "Dựng CI (GitHub Actions): lint → typecheck → test → build, chặn merge nếu fail."],
        hints: ["Error Boundary chỉ bắt lỗi render của con — lỗi async/handler cần bắt riêng.", "Field data (RUM) mới là cái Google xếp hạng; lab data chỉ để debug.", "CI gate là hợp đồng chất lượng của team — không xanh không lên main."],
        crit: ["Error Boundary + global handler bắt lỗi, có fallback UI, có log", "Web Vitals field data gửi về được và đọc được", "CI chặn PR khi lint/type/test/build fail"],
        traps: ["Chỉ dựa Error Boundary → bỏ lọt lỗi async/promise rejection.", "Log lỗi kèm dữ liệu nhạy cảm (token, PII) → rò rỉ.", "CI chỉ chạy test mà bỏ typecheck/lint → lỗi vẫn lọt production."] },
    ]},

const FULL_L23 = {"06.01":{"goals":["Hiểu cách dùng <code>Intl.DateTimeFormat</code>, <code>Intl.NumberFormat</code>, <code>Intl.RelativeTimeFormat</code> để format ngày/giờ/số/tiền theo locale.","Biết được cách sort chuỗi đúng ngôn ngữ bằng <code>Intl.Collator</code> thay vì so sánh mã ký tự.","Hiểu vì sao luôn lưu thời gian ở UTC và chỉ hiển thị theo timezone IANA như <code>Asia/Ho_Chi_Minh</code>.","Biết được vai trò của <code>navigator.language</code>, thuộc tính HTML <code>lang</code>/<code>dir</code> và pluralization đa ngôn ngữ.","Hiểu định hướng thay <code>Date</code> cũ bằng Temporal API."],"tasks":["Dựng một bảng hiển thị cùng một mốc thời gian và số tiền qua ít nhất 3 locale (ví dụ <code>vi-VN</code>, <code>en-US</code>, <code>ar-EG</code>) chỉ bằng API <code>Intl</code>.","Format một mảng tên tiếng Việt có dấu bằng <code>Intl.Collator</code> và so sánh kết quả với <code>Array.sort()</code> mặc định.","Lưu một mốc thời gian ở UTC rồi hiển thị đúng theo 2 timezone khác nhau bằng option <code>timeZone</code>.","Dùng <code>Intl.RelativeTimeFormat</code> để in ra chuỗi kiểu \"3 giờ trước\" theo locale hiện tại.","Thêm <code>lang</code> và <code>dir=\"rtl\"</code> cho một khối tiếng Ả Rập và quan sát layout đảo chiều."],"hints":["Đọc option của từng constructor <code>Intl</code> trước khi tự nối chuỗi — hầu hết nhu cầu đã có sẵn.","Timezone và locale là 2 khái niệm tách biệt: <code>en-US</code> vẫn có thể hiển thị giờ <code>Asia/Ho_Chi_Minh</code>.","Muốn số nhiều đúng ngữ pháp, tra <code>Intl.PluralRules</code> thay vì tự viết if/else.","Khởi tạo formatter một lần rồi tái dùng thay vì tạo mới trong vòng lặp."],"crit":["Format được ngày/giờ/số/tiền theo locale bất kỳ mà không dùng thư viện ngoài, và giải thích được vì sao luôn lưu UTC.","Sort chuỗi có dấu ra thứ tự đúng theo locale bằng <code>Intl.Collator</code>.","Cùng một UTC hiển thị đúng ở ít nhất 2 timezone khác nhau."],"traps":["Ghép chuỗi ngày bằng tay (<code>day + '/' + month</code>) khiến <code>09/10</code> mơ hồ giữa các nước.","Lưu thời gian đã cộng offset local vào DB làm hỏng dữ liệu khi đổi timezone.","So sánh chuỗi tiếng Việt bằng toán tử <code>&lt;</code> làm chữ có dấu xếp sai thứ tự."]},"06.02":{"goals":["Hiểu cách dùng Geolocation API kết hợp Permissions API để kiểm tra trạng thái quyền trước khi xin.","Biết được cách xin quyền vị trí đúng ngữ cảnh, sau hành động của user chứ không phải lúc load trang.","Hiểu 3 trạng thái quyền <code>granted</code>/<code>denied</code>/<code>prompt</code> và cách xử lý từng cái.","Biết được fallback IP-geolocation khi user từ chối toạ độ.","Hiểu cách dùng Page Visibility API và <code>navigator.connection</code> để thích ứng theo tab và mạng."],"tasks":["Dựng nút \"Tìm cửa hàng gần bạn\" chỉ gọi <code>getCurrentPosition</code> sau khi user bấm.","Dùng <code>navigator.permissions.query</code> để hiển thị UI khác nhau cho 3 trạng thái quyền.","Thêm fallback gọi API IP-geolocation khi <code>getCurrentPosition</code> trả lỗi từ chối.","Dùng Page Visibility API để tạm dừng một tác vụ (ví dụ polling) khi tab bị ẩn.","Đọc <code>navigator.connection.effectiveType</code> và log ra chất lượng mạng hiện tại."],"hints":["Kiểm tra <code>permissions.query</code> trước để tránh hiện popup xin quyền một cách vô duyên.","Truyền <code>enableHighAccuracy</code>, <code>timeout</code>, <code>maximumAge</code> để tránh treo vô hạn khi chờ GPS.","Xin quyền ngay lúc load là cách nhanh nhất để bị từ chối vĩnh viễn.","Network Information API chưa phủ hết trình duyệt — luôn kiểm tra tồn tại trước khi đọc."],"crit":["Xin quyền đúng thời điểm, xử lý gọn 3 trạng thái <code>granted</code>/<code>denied</code>/<code>prompt</code>, có fallback khi bị từ chối.","Vị trí chỉ được xin sau một hành động rõ ràng của user.","App vẫn hoạt động (qua fallback IP) khi user chặn toạ độ."],"traps":["Gọi <code>getCurrentPosition</code> ngay khi load khiến user chặn quyền vĩnh viễn.","Không xử lý nhánh lỗi làm app treo mãi ở trạng thái \"đang định vị\".","Giả định mọi trình duyệt đều có <code>navigator.connection</code> rồi crash khi truy cập."]},"06.03":{"goals":["Hiểu cách dùng <code>&lt;picture&gt;</code> + <code>srcset</code> + <code>sizes</code> để phục vụ ảnh responsive.","Biết được vì sao AVIF/WebP là mặc định 2026 và luôn set <code>width</code>/<code>height</code> để chống CLS.","Hiểu khi nào dùng <code>loading=\"lazy\"</code> và vì sao KHÔNG lazy-load ảnh LCP.","Biết được tác dụng của <code>decoding=\"async\"</code> và <code>fetchpriority=\"high\"</code> cho ảnh LCP.","Hiểu cách tối ưu <code>&lt;video&gt;</code> qua <code>preload</code>, <code>poster</code> và khái niệm adaptive streaming."],"tasks":["Đo LCP của trang có ảnh hero nặng bằng Lighthouse hoặc tab Performance trước khi tối ưu.","Chuyển ảnh hero sang AVIF/WebP với <code>&lt;picture&gt;</code> và <code>srcset</code>/<code>sizes</code> rồi đo lại LCP.","Thêm <code>width</code>/<code>height</code> cho mọi ảnh và đo chỉ số CLS trước/sau.","Gắn <code>fetchpriority=\"high\"</code> cho ảnh LCP và <code>loading=\"lazy\"</code> cho ảnh dưới màn hình.","Thêm <code>poster</code> và chỉnh <code>preload</code> cho một <code>&lt;video&gt;</code> để giảm tải ban đầu."],"hints":["Ảnh LCP thường là ảnh hero đầu trang — đừng để nó chờ lazy-load.","<code>sizes</code> mô tả kích thước hiển thị thật, giúp trình duyệt chọn nguồn trong <code>srcset</code>.","Set <code>width</code>/<code>height</code> để trình duyệt giữ chỗ, tránh nhảy layout khi ảnh về.","Đo trên mạng bị throttle mobile mới thấy rõ khác biệt LCP."],"crit":["Giảm được LCP đo bằng số nhờ tối ưu ảnh, và giải thích được vì sao lazy-load ảnh LCP là phản tác dụng.","Mọi ảnh có <code>width</code>/<code>height</code> và CLS không tăng khi ảnh tải về.","Ảnh LCP dùng định dạng hiện đại và được ưu tiên tải bằng <code>fetchpriority</code>."],"traps":["Đặt <code>loading=\"lazy\"</code> lên ảnh LCP làm LCP chậm thêm.","Quên <code>width</code>/<code>height</code> khiến layout nhảy và CLS tăng vọt.","Nhồi một ảnh 2MB cho mọi màn hình thay vì nhiều nguồn theo <code>srcset</code>."]},"06.04":{"goals":["Hiểu vì sao semantic HTML (<code>&lt;article&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, heading hierarchy) là nền của SEO và a11y.","Biết được các meta tag cốt lõi: title, description, canonical và cách quản lý <code>&lt;head&gt;</code> động.","Hiểu cách dùng Open Graph và Twitter Card để share ra mạng xã hội đẹp.","Biết được JSON-LD structured data theo Schema.org và vì sao nó là metadata upside cao nhất 2026.","Hiểu vì sao CSR thuần hại SEO và mối liên hệ với SSR/SSG ở Phase 09."],"tasks":["Cấu trúc lại một trang bằng thẻ ngữ nghĩa và một cây heading <code>h1</code>→<code>h2</code>→<code>h3</code> hợp lý.","Thêm đủ meta title, description, canonical vào <code>&lt;head&gt;</code> của trang.","Thêm thẻ Open Graph và Twitter Card rồi kiểm tra bằng công cụ share preview.","Viết một khối JSON-LD (ví dụ <code>Article</code> hoặc <code>Product</code>) và validate bằng Rich Results Test.","So sánh HTML mà crawler thấy giữa một trang CSR thuần và một trang render sẵn."],"hints":["Mỗi trang chỉ nên có một <code>h1</code> mô tả đúng nội dung chính.","Canonical giúp gộp các URL trùng nội dung, tránh loãng ranking.","OG image nên đủ lớn (khoảng 1200x630) để không bị crop xấu khi share.","Dùng Rich Results Test để bắt lỗi cú pháp JSON-LD trước khi deploy."],"crit":["Một trang có đủ meta + OG + JSON-LD, test được bằng Rich Results Test và share preview.","Cấu trúc heading và thẻ ngữ nghĩa đúng, không nhảy cấp heading.","Share preview hiển thị đúng tiêu đề, mô tả và ảnh."],"traps":["Nhồi mọi thứ vào <code>&lt;div&gt;</code> làm mất ngữ nghĩa, hại cả SEO lẫn screen reader.","Để trang SPA render meta rỗng lúc đầu khiến crawler và Facebook thấy thẻ trống.","Viết JSON-LD sai schema hoặc lệch nội dung hiển thị làm mất rich result."]},"06.05":{"goals":["Hiểu cách dùng <code>IntersectionObserver</code> cho lazy load, infinite scroll và active section.","Biết được khi nào dùng <code>ResizeObserver</code> và <code>MutationObserver</code> để phản ứng theo kích thước/thay đổi DOM.","Hiểu vì sao observer native tốt hơn viết tay <code>scroll</code> listener.","Biết được Speculation Rules API để prerender/prefetch trang kế và cách nó nâng cấp bài 01.04.","Hiểu View Transitions API để chuyển trang/state mượt như native."],"tasks":["Thay một <code>scroll</code> listener thủ công đang lazy-load ảnh bằng <code>IntersectionObserver</code>.","Dựng infinite scroll dùng một sentinel element và <code>IntersectionObserver</code>.","Dùng <code>ResizeObserver</code> để cập nhật layout một component khi container đổi kích thước.","Thêm một khối Speculation Rules để prefetch/prerender một điều hướng và quan sát tốc độ chuyển trang.","Áp dụng View Transitions API cho một chuyển đổi state và so sánh cảm giác mượt trước/sau."],"hints":["Đặt <code>rootMargin</code> để bắt đầu tải sớm trước khi phần tử thật sự vào viewport.","Nhớ <code>disconnect</code>/<code>unobserve</code> khi phần tử biến mất để tránh rò rỉ.","<code>ResizeObserver</code> chính xác hơn nghe sự kiện <code>resize</code> của window cho từng phần tử.","Speculation Rules cần cân nhắc chi phí băng thông — chỉ prerender trang khả năng cao được vào."],"crit":["Thay được một scroll-listener thủ công bằng <code>IntersectionObserver</code> và giải thích lợi ích; dùng Speculation Rules cho một điều hướng.","Infinite scroll hoặc lazy load chạy mượt, không còn nghe <code>scroll</code> liên tục.","Observer được dọn dẹp đúng cách khi không còn cần."],"traps":["Nghe <code>scroll</code> và tính toán trong callback gây giật và tốn CPU.","Quên hủy observer khiến callback vẫn chạy trên phần tử đã gỡ.","Prerender bừa mọi liên kết làm lãng phí băng thông và tài nguyên."]},"06.06":{"goals":["Hiểu iframe cơ bản: khác nhau giữa <code>src</code> và <code>srcdoc</code>, cùng <code>loading=\"lazy\"</code>, <code>allow</code>, <code>referrerpolicy</code>.","Biết được cách giao tiếp cross-origin bằng <code>window.postMessage</code> và luôn kiểm tra <code>event.origin</code>.","Hiểu thuộc tính <code>sandbox</code> để cô lập nội dung không tin cậy với quyền tối thiểu.","Biết được cách inject một widget iframe tự co giãn chiều cao qua postMessage.","Hiểu cách chống clickjacking bằng <code>X-Frame-Options</code> và CSP <code>frame-ancestors</code>."],"tasks":["Nhúng một iframe cross-origin và gửi/nhận dữ liệu 2 chiều bằng <code>postMessage</code> có kiểm tra <code>event.origin</code>.","Viết script inject một iframe widget vào trang chủ nhà và cho nó tự báo chiều cao để resize.","Bọc một iframe nội dung không tin cậy bằng <code>sandbox</code> chỉ cấp <code>allow-scripts</code> tối thiểu cần thiết.","Cấu hình <code>frame-ancestors</code> (hoặc <code>X-Frame-Options</code>) để chặn trang mình bị nhúng trái phép và kiểm chứng.","Thử gửi <code>postMessage</code> với <code>targetOrigin</code> cụ thể thay vì <code>*</code> cho dữ liệu nhạy cảm."],"hints":["Luôn so <code>event.origin</code> với danh sách origin tin cậy trước khi xử lý message.","Dùng <code>srcdoc</code> khi nội dung nhỏ và tự sinh, <code>src</code> khi tải từ URL ngoài.","Sandbox mặc định chặn hết — chỉ mở đúng khả năng cần (<code>allow-scripts</code>, <code>allow-forms</code>).","Resize theo nội dung cần iframe con chủ động gửi chiều cao ra ngoài qua postMessage."],"crit":["Nhúng một iframe cross-origin và giao tiếp 2 chiều bằng postMessage có kiểm tra origin, đồng thời cấu hình được chặn trang mình khỏi bị nhúng trái phép.","Widget inject tự co giãn chiều cao đúng theo nội dung.","Iframe không tin cậy chạy trong <code>sandbox</code> với quyền tối thiểu."],"traps":["Dùng <code>targetOrigin</code> là <code>*</code> hoặc bỏ kiểm tra <code>event.origin</code>, mở đường cho rò rỉ dữ liệu.","Cấp <code>sandbox</code> quá rộng (thêm cả <code>allow-same-origin</code> lẫn <code>allow-scripts</code>) làm mất tác dụng cô lập.","Quên đặt <code>frame-ancestors</code> khiến trang bị nhúng và tấn công clickjacking."]},"07.01":{"goals":["Hiểu bản chất <code>server state</code> chỉ là cache mượn từ server, cần refetch và invalidation.","Hiểu <code>client state</code> là UI state thuần mà bạn sở hữu 100%.","Biết được vì sao nhét server state vào <code>useState</code>/Redux là sai gốc rễ.","Hiểu vòng đời khác nhau giữa hai loại state để chọn công cụ đúng."],"tasks":["Lập bảng liệt kê mọi biến state trong một feature thật rồi phân loại từng biến là client hay server.","Dựng một component fetch data bằng <code>useState</code> và tự viết tay loading/error/refetch để thấy code phình ra.","Chỉ ra hai component cùng dùng một dữ liệu server nhưng cache lệch nhau, ghi lại lý do.","Đối chiếu danh sách server state với các nhu cầu TTL, dedupe, background refetch để chứng minh <code>useState</code> thiếu chỗ nào."],"hints":["Hỏi: dữ liệu này ai sở hữu? Nếu server sở hữu thì gần như luôn là server state.","Nếu một biến cần đồng bộ lại sau khi user khác sửa, đó là dấu hiệu server state.","Modal mở/đóng, tab active, form nháp gần như luôn là client state."],"crit":["Nhìn một biến state bất kỳ là phân loại được client hay server và biết công cụ nào hợp.","Giải thích được ba thứ server state cần mà <code>useState</code> không có: TTL, dedupe, background refetch.","Liệt kê đúng client vs server cho ít nhất một feature thật."],"traps":["Bẫy thường gặp: coi mọi thứ là state và nhét hết vào <code>useState</code>/Redux.","Bẫy thường gặp: đồng bộ server state thủ công giữa nhiều component gây lệch dữ liệu.","Bẫy thường gặp: nhầm dữ liệu phái sinh (derived) là state cần lưu riêng."]},"07.02":{"goals":["Hiểu <code>query key</code>, phân biệt <code>staleTime</code> và <code>gcTime</code>.","Biết được cơ chế background refetch, dedupe request trùng và retry.","Hiểu vì sao phải <code>invalidation</code> sau mutation để UI tự cập nhật.","Hiểu optimistic update kèm rollback và cách làm pagination / infinite query."],"tasks":["Dựng một danh sách dùng <code>useQuery</code> với <code>query key</code> rõ ràng rồi mở hai tab để thấy dedupe hoạt động.","Đo hành vi background refetch khi <code>staleTime</code> hết hạn và khi focus lại tab.","Viết một mutation like/unlike có optimistic update rồi ép API trả lỗi để kiểm tra rollback.","Gọi <code>invalidateQueries</code> đúng key sau mutation và xác nhận UI tự làm mới.","So sánh TanStack Query, SWR và RTK Query trên cùng một use case và ghi lại trade-off."],"hints":["<code>staleTime</code> quyết định khi nào data bị coi là cũ; <code>gcTime</code> quyết định khi nào cache bị dọn.","Optimistic update cần lưu snapshot cũ trong <code>onMutate</code> để rollback ở <code>onError</code>.","Nếu UI không cập nhật sau mutation, gần như luôn là sai key khi invalidate.","Dùng DevTools của TanStack Query để nhìn trạng thái từng query."],"crit":["Một mutation cập nhật UI lạc quan rồi rollback đúng khi API lỗi, và cache invalidate đúng chỗ.","Giải thích được khác biệt <code>staleTime</code> vs <code>gcTime</code> bằng ví dụ đo được.","Chứng minh dedupe: hai request trùng chỉ bắn một lần lên network."],"traps":["Bẫy thường gặp: quên invalidate hoặc invalidate sai key nên dữ liệu không tự cập nhật.","Bẫy thường gặp: đặt <code>staleTime: 0</code> mặc định gây refetch liên tục.","Bẫy thường gặp: optimistic update không lưu snapshot nên không rollback được khi lỗi."]},"07.03":{"goals":["Hiểu thang lựa chọn: <code>useState</code>/<code>useReducer</code> → Context → Zustand → Redux Toolkit.","Hiểu vì sao Context không phải state manager và làm re-render mọi consumer.","Biết được khi nào dùng XState / state machine thay cho rải boolean.","Hiểu cách biện hộ lựa chọn state tool theo quy mô và tần suất đổi."],"tasks":["Dựng cùng một feature global nhỏ bằng Context rồi bằng Zustand và đo số lần re-render.","Bọc một value hay đổi vào Context và dùng React DevTools để quan sát mọi consumer cùng re-render.","Refactor một khối boolean soup (<code>isLoading</code>/<code>isError</code>/<code>isSuccess</code>) của flow upload thành state machine bằng XState.","Viết một đoạn biện hộ ngắn cho việc chọn state tool của một feature cụ thể kèm lý do.","So sánh boilerplate giữa Zustand và Redux Toolkit cho cùng một store."],"hints":["Context tốt cho giá trị ít đổi như theme/locale; tránh nhét state đổi liên tục vào.","Zustand cho phép selector để chỉ component quan tâm mới re-render.","Nếu thấy nhiều boolean loại trừ lẫn nhau, đó là dấu hiệu cần state machine.","Redux Toolkit đáng dùng khi cần devtools và time-travel cho state lớn."],"crit":["Biện hộ được lựa chọn state tool cho một feature cụ thể, và refactor được một boolean soup thành state machine.","Chứng minh bằng đo đạc rằng Context làm re-render rộng hơn Zustand có selector.","State machine sau refactor biểu diễn được mọi trạng thái hợp lệ và loại được trạng thái vô nghĩa."],"traps":["Bẫy thường gặp: dùng Context như state manager cho giá trị đổi liên tục gây re-render toàn cây.","Bẫy thường gặp: nhảy thẳng lên Redux khi <code>useState</code> local đã đủ.","Bẫy thường gặp: rải nhiều boolean tạo trạng thái mâu thuẫn thay vì mô hình hoá bằng state machine."]},"07.04":{"goals":["Hiểu khác biệt controlled vs uncontrolled và tác động lên re-render.","Biết được vì sao react-hook-form nhanh hơn cho form lớn.","Hiểu cách dùng zod làm schema chung cho cả form lẫn API boundary.","Hiểu async validation, field array và error UX ở quy mô lớn."],"tasks":["Dựng form 30 field kiểu controlled rồi đo số lần re-render mỗi keystroke.","Chuyển form đó sang react-hook-form (uncontrolled) và so sánh lại số re-render.","Viết một schema <code>zod</code> và dùng chung cho validate form lẫn suy ra type qua <code>z.infer</code>.","Thêm một field async validation (ví dụ kiểm tra username tồn tại) và xử lý trạng thái đang kiểm tra.","Dựng một field array thêm/xoá dòng và kiểm tra error UX hiển thị đúng từng dòng."],"hints":["Uncontrolled giữ giá trị trong DOM nên gõ không kích hoạt re-render toàn form.","Dùng <code>z.infer</code> để type form suy ra thẳng từ schema, tránh khai báo trùng.","Debounce async validation để tránh gọi API mỗi keystroke.","Hiển thị lỗi lúc blur hoặc submit thường mượt hơn hiển thị mọi keystroke."],"crit":["Form lớn không re-render thừa mỗi keystroke, và schema zod tái dùng được cho cả client lẫn type.","Async validation hoạt động mà không spam request nhờ debounce.","Field array thêm/xoá dòng vẫn giữ error mapping đúng từng dòng."],"traps":["Bẫy thường gặp: dùng controlled cho form lớn khiến mỗi keystroke re-render cả form.","Bẫy thường gặp: khai báo type và rule validate hai nơi khiến chúng lệch nhau.","Bẫy thường gặp: async validation không debounce gây gọi API liên tục."]},"07.05":{"goals":["Hiểu <code>Proxy</code> và <code>Reflect</code> với các trap <code>get</code>/<code>set</code>/<code>has</code>/<code>deleteProperty</code>.","Hiểu reactivity dựng trên Proxy: track dependency lúc get, trigger lúc set.","Biết được cách immer dùng Proxy để viết mutate nhưng sinh immutable state.","Hiểu giới hạn của Proxy: không bắt primitive, chi phí, khó debug."],"tasks":["Viết một object reactive tối giản bằng <code>Proxy</code> có log mỗi lần get và set.","Cài trap <code>set</code> và <code>deleteProperty</code> dùng <code>Reflect</code> để can thiệp thao tác.","Dựng một demo track dependency lúc get rồi trigger callback lúc set giống Vue/Valtio thu nhỏ.","Dùng <code>immer</code> produce một state bằng cú pháp mutate rồi in ra để chứng minh object gốc không đổi.","Thử thao tác trên một primitive để tự thấy Proxy không bắt được và ghi lại giới hạn."],"hints":["Luôn trả về qua <code>Reflect.get</code>/<code>Reflect.set</code> để giữ hành vi mặc định đúng.","immer hoạt động theo copy-on-write: chỉ nhánh bị chạm mới được clone.","Track dependency nghĩa là ghi lại ai đang đọc property lúc get.","Proxy chỉ bọc được object nên số/chuỗi đứng một mình không thể reactive trực tiếp."],"crit":["Tự viết được một object reactive tối giản bằng Proxy log mỗi lần get/set, và giải thích immer biến mutate thành immutable thế nào.","Trap set/delete dùng Reflect vẫn giữ đúng hành vi gốc của object.","Nêu được ít nhất hai giới hạn thực tế của Proxy bằng ví dụ."],"traps":["Bẫy thường gặp: quên dùng <code>Reflect</code> trong trap làm hỏng hành vi mặc định.","Bẫy thường gặp: tưởng Proxy bắt được thao tác trên primitive.","Bẫy thường gặp: nghĩ immer clone toàn bộ state thay vì copy-on-write theo nhánh."]},"07.06":{"goals":["Hiểu cách dựng instance tập trung bằng <code>axios.create</code> và interceptors gắn token/base URL.","Biết được refresh token flow: bắt 401, refresh, retry và hàng đợi request khi đang refresh.","Hiểu huỷ request bằng <code>AbortController</code> để tránh race và set state trên component đã unmount.","Hiểu retry + backoff, chuẩn hoá error và transform response cho UI nhất quán.","Hiểu cách kết hợp axios (transport) với TanStack Query (cache/state)."],"tasks":["Dựng một <code>apiClient</code> bằng <code>axios.create</code> với interceptor gắn auth token và base URL chung.","Cài refresh token flow: interceptor bắt 401 → refresh → retry, và xếp hàng các request khác trong lúc refresh.","Dùng <code>AbortController</code> huỷ request khi component unmount hoặc user gõ tiếp trong autocomplete.","Thêm retry kèm backoff có jitter cho lỗi mạng và một hàm normalize mọi lỗi về một dạng chuẩn.","Gửi một upload bằng <code>FormData</code>/multipart kèm progress event rồi bọc apiClient trong một <code>useQuery</code>."],"hints":["Chỉ nên có một lần refresh chạy; các request 401 khác chờ promise refresh đó rồi retry.","Lưu <code>AbortController</code> theo mỗi request để huỷ đúng cái đang bay.","Chuẩn hoá error về một shape cố định giúp UI không phải if/else theo từng endpoint.","Để axios lo transport, để TanStack Query lo cache, staleTime và invalidation."],"crit":["Có một <code>apiClient</code> tập trung: tự gắn token, tự refresh khi 401, huỷ được request đang bay, và mọi lỗi về một dạng chuẩn.","Khi nhiều request 401 cùng lúc, chỉ một lần refresh chạy rồi các request được retry.","Huỷ request khi unmount không còn gây cảnh báo set state trên component đã unmount."],"traps":["Bẫy thường gặp: mỗi component tự <code>axios.get</code> với config riêng và xử lý lỗi mỗi nơi một kiểu.","Bẫy thường gặp: refresh token bị gọi nhiều lần song song vì không có hàng đợi.","Bẫy thường gặp: không huỷ request cũ gây race condition và set state trên component đã unmount."]},"08.01":{"goals":["Hiểu cách generic function/type giữ quan hệ type giữa input và output thay vì trả <code>any</code>","Biết dùng ràng buộc <code>extends</code> và default type param để giới hạn và mặc định type","Hiểu type inference: để TS tự suy type thay vì annotate thừa","Biết dùng <code>as const</code> và literal types để giữ giá trị hẹp nhất","Hiểu cách viết hàm util generic tái dùng (<code>pick</code>, <code>groupBy</code>) giữ nguyên type"],"tasks":["Viết hàm <code>getById&lt;T&gt;(items: T[], id): T | undefined</code> và kiểm tra IDE suy đúng type trả về theo mảng truyền vào","Viết hàm <code>pick&lt;T, K extends keyof T&gt;(obj, keys)</code> trả về đúng subset type mà không cần ép kiểu","Viết hàm <code>groupBy</code> generic gom mảng theo key và xác nhận type kết quả là <code>Record&lt;K, T[]&gt;</code>","Thêm default type param cho một generic (ví dụ <code>&lt;T = string&gt;</code>) và gọi cả có lẫn không truyền type","Dùng <code>as const</code> cho một object config rồi hover xem literal type được giữ ra sao"],"hints":["Nếu IDE trả về <code>any</code>, thường bạn đang annotate thừa hoặc thiếu ràng buộc <code>extends keyof</code>","Đặt type param ở chỗ TS có thể suy từ đối số (argument) để không phải viết <code>fn&lt;Type&gt;()</code> mỗi lần","Dùng <code>keyof</code> và indexed access <code>T[K]</code> để giữ liên kết giữa key và value","Hover vào biến trong IDE để đọc type TS suy ra trước khi thêm annotation"],"crit":["Viết được một hàm generic mà IDE tự suy đúng type trả về theo input, không cần ép kiểu","Hàm <code>pick</code>/<code>groupBy</code> giữ nguyên type mà không xuất hiện <code>any</code> ở đầu ra","Dùng được <code>extends</code> để ràng buộc và default type param cho ít nhất một generic"],"traps":["Rải <code>any</code> khi generic khó, làm mất toàn bộ gợi ý và an toàn type","Annotate type trả về bằng tay khiến TS ngừng suy và che mất lỗi","Quên <code>as const</code> nên literal bị mở rộng thành <code>string</code>/<code>number</code> chung chung"]},"08.02":{"goals":["Hiểu discriminated union và cách nó làm trạng thái sai <em>không biểu diễn được</em>","Biết mô hình state (idle/loading/success/error) bằng union thay vì nhiều boolean rời","Hiểu type narrowing qua <code>typeof</code>, <code>in</code> và type guard","Biết dùng <code>never</code> cho exhaustiveness check để compiler ép xử lý đủ case","Hiểu cách nối mô hình union với XState/07.03"],"tasks":["Định nghĩa union state có field discriminant <code>status</code> cho idle/loading/success/error, mỗi nhánh mang data riêng","Chứng minh tổ hợp bất khả thi (loading + error cùng true) không còn compile được với mô hình mới","Viết <code>switch (state.status)</code> và narrow để truy cập <code>state.data</code> chỉ ở nhánh success","Thêm nhánh <code>default</code> gán vào biến <code>never</code> để bật exhaustiveness check","Thêm một status mới rồi xác nhận compiler báo lỗi tại chỗ chưa xử lý"],"hints":["Discriminant nên là literal type chung tên field ở mọi nhánh (ví dụ <code>status</code>)","Dùng <code>in</code> để narrow khi các nhánh có field khác nhau, <code>typeof</code> cho primitive","Mẹo exhaustiveness: <code>const _: never = state</code> trong <code>default</code> sẽ đỏ khi thiếu case","Đừng dùng <code>as</code> để 'ép' state; hãy để narrowing tự thu hẹp type"],"crit":["Mô hình state bằng discriminated union và có exhaustive switch mà compiler ép xử lý đủ case","Truy cập <code>data</code>/<code>error</code> chỉ hợp lệ trong đúng nhánh sau khi narrow","Thêm case mới thì compiler báo lỗi ngay tại nơi chưa xử lý"],"traps":["Dùng nhiều boolean rời (<code>isLoading</code>, <code>isError</code>) khiến tổ hợp bất khả thi vẫn lọt","Quên nhánh <code>never</code> nên thêm case mới mà không được cảnh báo","Dùng <code>as</code> ép kiểu thay vì narrow, làm mất an toàn tại runtime"]},"08.03":{"goals":["Hiểu các utility type (<code>Partial</code>, <code>Pick</code>, <code>Omit</code>, <code>Record</code>, <code>ReturnType</code>) và cách chúng hoạt động","Biết viết mapped type để tạo 'type giống type kia nhưng tất cả optional'","Hiểu conditional type <code>T extends U ? X : Y</code> và <code>infer</code> để suy type con","Biết dùng template literal type cho route type-safe và event name","Hiểu khi nào nên dừng, tránh over-engineer type-level"],"tasks":["Tự viết lại <code>Partial&lt;T&gt;</code> bằng mapped type với modifier <code>?</code>","Tự viết lại <code>Pick&lt;T, K&gt;</code> và <code>Omit&lt;T, K&gt;</code> rồi so kết quả với bản gốc","Viết một conditional type dùng <code>infer</code> (ví dụ rút element type của mảng) giải quyết nhu cầu thật","Tạo template literal type sinh route như <code>/users/${string}</code> hoặc event <code>on${Capitalize&lt;K&gt;}</code>","Chọn một chỗ type đang quá phức tạp và đơn giản hoá lại, ghi lý do dừng"],"hints":["Mapped type cú pháp lõi: <code>{ [K in keyof T]: ... }</code>, thêm/bớt <code>?</code> và <code>readonly</code> bằng <code>+/-</code>","<code>infer</code> chỉ dùng trong nhánh <code>extends</code> của conditional type","Template literal type kết hợp tốt với các intrinsic như <code>Uppercase</code>/<code>Capitalize</code>","Nếu type khó đọc hơn code nó bảo vệ, đó là tín hiệu nên dừng"],"crit":["Tự viết được <code>Partial</code>/<code>Pick</code> từ đầu và một conditional type giải quyết một nhu cầu thật","Bản tự viết cho kết quả tương đương utility type gốc trên vài ca kiểm thử","Có ít nhất một template literal type áp dụng vào route hoặc event name"],"traps":["Copy utility type mà không hiểu, nên không sửa được khi cần biến thể","Quên <code>infer</code> phải nằm trong nhánh <code>extends</code> nên type không compile","Over-engineer type-level cho vấn đề nhỏ, khiến type khó đọc và khó bảo trì"]},"08.04":{"goals":["Hiểu vì sao TS không kiểm tra runtime và ranh giới I/O là nơi type 'nói dối'","Biết dùng <code>zod</code> (hoặc valibot) để validate runtime và suy type từ schema","Hiểu nguyên tắc một nguồn chân lý: schema sinh ra type, không khai type tay","Biết type hoá <code>fetch</code>/API layer và parse response tại biên (nối 05.01)","Hiểu khái niệm end-to-end type safety (tRPC) và tránh <code>any</code> ở ranh giới"],"tasks":["Định nghĩa schema <code>User</code> bằng zod rồi dùng <code>z.infer</code> lấy type thay vì khai tay","Viết wrapper <code>fetch</code> gọi API và <code>schema.parse(response)</code> tại biên trước khi trả về","Chủ động trả JSON thiếu field và xác nhận validation ném lỗi rõ ràng thay vì crash sâu trong app","Validate một nguồn ngoài khác (localStorage hoặc URL param) bằng cùng cách parse tại biên","Rà toàn bộ ranh giới I/O và loại bỏ mọi <code>any</code>/<code>as</code> còn sót"],"hints":["Đặt validation ngay tại điểm dữ liệu vào app, không rải rác sâu bên trong","Dùng <code>safeParse</code> khi muốn xử lý lỗi tường minh thay vì để throw","<code>z.infer&lt;typeof schema&gt;</code> giữ type và runtime luôn đồng bộ từ một nguồn","Coi mọi dữ liệu ngoài là không đáng tin cho tới khi được parse qua schema"],"crit":["Mọi dữ liệu vào app (API, localStorage, URL) được validate tại biên và có type suy ra từ schema","Type của dữ liệu ngoài đến từ <code>z.infer</code>, không khai bằng tay ở nơi khác","Không còn <code>any</code>/<code>as</code> ở lớp ranh giới I/O"],"traps":["Khai <code>as User</code> cho response mà không validate, để runtime thiếu field làm crash","Khai type tay song song schema, khiến hai nguồn chân lý lệch nhau theo thời gian","Validate quá muộn (sâu trong logic) nên lỗi khó truy nguồn về biên I/O"]},"09.01":{"goals":["Phân biệt được 4 chiến lược <code>CSR</code>, <code>SSR</code>, <code>SSG</code>, <code>ISR</code> theo thời điểm HTML được tạo ra.","Hiểu trade-off của mỗi chiến lược trên 3 trục: SEO, tốc độ first paint, chi phí server.","Nắm được <code>ISR</code> là sự lai giữa <code>SSG</code> và revalidate định kỳ cho nội dung đổi vừa phải.","Biết map từng loại trang (blog, dashboard, docs, marketing) sang chiến lược render phù hợp."],"tasks":["Lập bảng so sánh 4 chiến lược với các cột: nơi render, thời điểm tạo HTML, điểm SEO, first paint, chi phí server — mỗi ô ghi rõ ràng.","Với trang blog có SEO, chọn <code>SSG</code> hoặc <code>ISR</code> và viết 2-3 câu giải thích vì sao không dùng <code>CSR</code>.","Với dashboard sau đăng nhập, chọn <code>CSR</code> hoặc <code>SSR</code> và giải thích vì sao SEO không còn là ràng buộc.","Dựng một demo nhỏ (Next.js) cho cùng một trang ở 2 chế độ và đo <code>TTFB</code> + <code>LCP</code> để thấy khác biệt bằng số."],"hints":["Câu hỏi định hướng: nội dung này có cần Google index không, và có đổi thường xuyên không?","Nếu nội dung ít đổi nhưng số lượng trang lớn thì build-time (<code>SSG</code>) sẽ tốn thời gian build — cân nhắc <code>ISR</code>.","SEO không chỉ là có HTML sẵn, mà còn là bot đọc được nội dung ngay ở lần request đầu.","Đừng nhầm 'nhanh khi điều hướng nội bộ' (<code>CSR</code>) với 'nhanh ở first paint' — hai thứ khác nhau."],"crit":["Cho một loại trang cụ thể, chọn được chiến lược render và giải thích trade-off về SEO/tốc độ/chi phí (Đã đủ khi).","Bảng so sánh 4 chiến lược đầy đủ và phân biệt được thời điểm tạo HTML của từng cái.","Chỉ ra được ít nhất một trường hợp <code>ISR</code> hợp hơn cả <code>SSG</code> lẫn <code>SSR</code>."],"traps":["Mặc định dùng <code>CSR</code> (SPA) cho mọi trang, kể cả trang marketing cần SEO.","Tưởng <code>SSG</code> luôn tốt nhất mà quên chi phí build khi có hàng nghìn trang động.","Chọn <code>SSR</code> cho trang tĩnh ít đổi, gánh chi phí server không cần thiết."]},"09.02":{"goals":["Hiểu hydration là gì và vì sao nó tốn thời gian, khiến trang SSR 'chết' vài giây.","Phân biệt được <code>FCP</code> (thấy nội dung) và <code>TTI</code> (bấm được) và vì sao chúng lệch nhau.","Nắm cơ chế Streaming SSR với <code>Suspense</code> boundaries gửi HTML dần từng phần.","Hiểu Islands architecture chỉ hydrate phần tương tác và để phần tĩnh nguyên vẹn."],"tasks":["Dựng một trang SSR đơn giản, mở DevTools và ghi lại khoảng thời gian giữa lúc thấy nội dung và lúc nút bấm phản hồi.","Bọc một phần trang chậm trong <code>Suspense</code> để thấy HTML còn lại stream về trước và đo thay đổi <code>FCP</code>.","Tạo một trang Astro có một phần tĩnh và một component tương tác, kiểm tra Network tab để xác nhận JS chỉ tải cho phần island.","Viết đoạn giải thích 3-4 câu về vì sao progressive hydration giảm khoảng 'chết' của trang."],"hints":["Trong DevTools Performance, tìm long task lớn ngay sau khi HTML tải xong — đó thường là hydration.","Streaming không làm hydration nhanh hơn, nó cho nội dung hiện ra sớm hơn và theo từng phần.","Islands giảm hydration bằng cách giảm lượng JS cần chạy, không phải chạy nhanh hơn.","So sánh tổng JS bundle của một trang SSR truyền thống với một trang islands tương đương."],"crit":["Giải thích được vì sao trang SSR hiện ra nhưng chưa bấm được, và streaming/islands giảm điều đó thế nào (Đã đủ khi).","Phân biệt rõ <code>FCP</code> và <code>TTI</code> bằng số đo thực tế từ một trang demo.","Chỉ ra được phần nào của trang cần hydrate và phần nào không, kèm lý do."],"traps":["Nhầm hydration với việc tải HTML — thực ra HTML đã có, JS mới là thứ đang chạy để gắn tương tác.","Tưởng Streaming SSR làm trang tương tác sớm hơn, trong khi nó chỉ làm nội dung hiện sớm hơn.","Hydrate toàn bộ trang kể cả phần tĩnh, biến hydration thành bottleneck ở app lớn."]},"09.03":{"goals":["Phân biệt Server Component và Client Component (<code>\"use client\"</code>) và ranh giới giữa chúng.","Hiểu cái gì được serialize khi truyền props qua ranh giới server-client.","Nắm cách fetch data ngay trong server component mà không cần <code>useEffect</code>/loading state.","Biết khi nào bắt buộc dùng client component (state, event, browser API) và vai trò của server actions."],"tasks":["Viết một server component fetch data trực tiếp và render, không dùng <code>useEffect</code>, rồi kiểm tra bundle client giảm.","Thêm <code>\"use client\"</code> vào một component có <code>onClick</code>/<code>useState</code> và xác nhận vì sao nó phải là client.","Thử truyền một function làm prop qua ranh giới server-client và quan sát lỗi serialize để hiểu giới hạn.","Viết một server action xử lý form submit và giải thích vì sao logic đó không cần chạy ở client."],"hints":["Quy tắc ngón tay cái: mặc định là server component, chỉ thêm <code>\"use client\"</code> khi thật sự cần tương tác.","Props truyền xuống client component phải serialize được — function, class instance, Date phức tạp thường không qua được.","Nếu component chỉ hiển thị dữ liệu và không có event handler, gần như chắc chắn nó nên là server component.","<code>\"use client\"</code> đánh dấu ranh giới, mọi thứ import bên dưới nó cũng thành client."],"crit":["Phân loại được một component nên server hay client và giải thích lợi ích bundle/SEO của RSC (Đã đủ khi).","Có ít nhất một server component fetch data không dùng <code>useEffect</code> và chạy được.","Giải thích được cái gì serialize qua ranh giới và vì sao function không truyền được."],"traps":["Đặt <code>\"use client\"</code> ở component gốc, vô tình biến cả cây con thành client và mất lợi ích RSC.","Cố dùng <code>useState</code>/<code>useEffect</code> trong server component rồi gặp lỗi khó hiểu.","Truyền function hoặc object không serialize được làm prop từ server xuống client component."]},"09.04":{"goals":["Hiểu edge rendering/functions chạy gần user và tác động lên <code>TTFB</code>.","Nắm được các lớp cache theo thứ tự: browser → CDN → server.","Biết áp <code>Cache-Control</code> và <code>stale-while-revalidate</code> ở tầng HTTP cho cả trang render.","Map mỗi chiến lược render sang tác động lên <code>LCP</code>/<code>INP</code>/<code>CLS</code> (nối Phase 02)."],"tasks":["Vẽ sơ đồ đường đi của một request qua các lớp browser → CDN → server và đánh dấu chỗ cache hit/miss.","Đặt header <code>Cache-Control: s-maxage=60, stale-while-revalidate=300</code> cho một route và giải thích hành vi.","Deploy một route ở edge và so sánh <code>TTFB</code> với route chạy ở region xa user.","Với mỗi chiến lược render, ghi một dòng dự đoán nó cải thiện hay hại <code>LCP</code>/<code>INP</code>/<code>CLS</code> thế nào."],"hints":["<code>TTFB</code> tối ưu nhất khi request được phục vụ từ cache CDN gần user, không phải chạy server.","<code>stale-while-revalidate</code> cho phép trả bản cũ ngay rồi âm thầm cập nhật nền — tốt cho <code>TTFB</code>.","Edge nhanh về mạng nhưng hạn chế về runtime/DB access — cân nhắc phần logic đặt ở đâu.","<code>LCP</code> chịu ảnh hưởng lớn từ <code>TTFB</code>, nên cache tốt thường kéo cả hai xuống."],"crit":["Vẽ được đường đi của một request qua các lớp cache và chỉ ra chỗ tối ưu <code>TTFB</code>/<code>LCP</code> (Đã đủ khi).","Cấu hình được <code>Cache-Control</code>/<code>stale-while-revalidate</code> đúng và giải thích hành vi cache.","Chỉ ra được mối liên hệ giữa nơi đặt render/cache và các chỉ số Web Vitals."],"traps":["Nghĩ edge luôn nhanh hơn, quên rằng truy cập DB xa từ edge có thể còn chậm hơn region gần DB.","Đặt <code>Cache-Control</code> quá dài cho nội dung động, khiến user thấy dữ liệu cũ.","Bỏ qua tầng CDN, để mọi request đánh thẳng server và gánh <code>TTFB</code> cao."]},"09.05":{"goals":["Hiểu Islands architecture thực chiến: mặc định 0 JS, chỉ hydrate phần tương tác.","Nắm 4 client directives <code>client:load</code>/<code>client:idle</code>/<code>client:visible</code>/<code>client:only</code> và kiểm soát khi nào island hydrate.","Hiểu cái giá của việc nhúng nhiều framework (React + Vue + Svelte): mỗi island là runtime riêng, tốn bundle từng cái.","Biết cách chia sẻ state giữa các island qua nano stores/custom events/URL thay vì context.","Phân biệt khi nào Astro hợp (content-heavy) và khi nào nên dùng Next/Remix (app tương tác nặng sau auth)."],"tasks":["Dựng một trang Astro có ít nhất 2 island thuộc 2 framework khác nhau (ví dụ React và Vue).","Gán cho mỗi island một client directive khác nhau và kiểm tra Network tab để xác nhận thời điểm JS tải.","Cài một island dùng <code>client:visible</code> và cuộn xuống để xác nhận nó chỉ hydrate khi vào viewport (nối IntersectionObserver).","Chia sẻ một giá trị state giữa 2 island qua nano stores hoặc custom event và chứng minh context không dùng được.","Đo tổng bundle JS và ghi lại phần đóng góp của mỗi framework runtime để thấy cái giá multi-framework."],"hints":["<code>client:only</code> bỏ qua render server hoàn toàn — chỉ dùng khi component phụ thuộc browser API.","<code>client:idle</code> hoãn hydrate tới khi trình duyệt rảnh (rIC), tốt cho widget không khẩn cấp.","Mỗi island là một cây component tách biệt, nên không có instance chung để share qua context.","Nano stores hoạt động ngoài framework nên là cầu nối tự nhiên giữa các island khác framework."],"crit":["Dựng được trang Astro có ít nhất 2 island khác framework, mỗi cái dùng client directive khác nhau, giải thích được cái giá multi-framework và cách chia sẻ state (Đã đủ khi).","Xác nhận bằng Network tab rằng mỗi directive quyết định đúng thời điểm hydrate.","Chứng minh được state chia sẻ giữa island qua store/event/URL chứ không qua context."],"traps":["Dùng <code>client:load</code> cho mọi island, đánh mất lợi ích hoãn hydrate và tăng JS đầu trang.","Cố share state giữa các island bằng React context và không hiểu vì sao nó không hoạt động.","Nhúng nhiều framework vô tội vạ, khiến bundle phình vì kéo theo nhiều runtime riêng biệt."]},"10.01":{"goals":["Hiểu accessibility tree là gì và vì sao browser sinh nó song song với DOM cho công nghệ hỗ trợ.","Chọn đúng element ngữ nghĩa: <code>&lt;button&gt;</code> cho hành động, <code>&lt;a&gt;</code> cho điều hướng, heading và landmark cho cấu trúc.","Nắm được những gì element native tặng miễn phí: focusable, keyboard, role, state.","Nhận ra vì sao <code>&lt;div onClick&gt;
