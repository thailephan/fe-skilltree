</code> là gốc rễ của phần lớn lỗi a11y."],"tasks":["Lấy một trang đang dùng <code>&lt;div onClick&gt;</code> và refactor mọi phần tử tương tác về đúng thẻ native (<code>&lt;button&gt;</code>, <code>&lt;a&gt;</code>).","Bọc trang bằng landmark thật: <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;footer&gt;</code> và một cây heading <code>&lt;h1&gt;-&lt;h2&gt;-&lt;h3&gt;</code> không nhảy cấp.","Mở DevTools, tab Accessibility, xem accessibility tree của trang và đối chiếu từng node với role browser gán cho nó.","Rút toàn bộ chuột ra: duyệt hết trang chỉ bằng Tab, Shift+Tab, Enter và Space, xác nhận mọi hành động đều tới được.","Ghi lại một danh sách trước/sau: mỗi <code>&lt;div&gt;</code> đã đổi thành thẻ gì và nó tự nhận role, keyboard nào."],"hints":["Nếu bạn phải thêm <code>tabindex</code>, <code>role</code> và listener bàn phím cho một <code>&lt;div&gt;</code>, gần như chắc chắn bạn đang mô phỏng lại một <code>&lt;button&gt;</code> — dùng luôn <code>&lt;button&gt;</code>.","Phân biệt bằng câu hỏi: phần tử này điều hướng sang URL khác (<code>&lt;a&gt;</code>) hay thực thi hành động trong trang (<code>&lt;button&gt;</code>)?","Trong DevTools, chọn một node và xem mục Computed Properties để biết role, name, state thực tế screen reader nhận được.","Mỗi trang chỉ nên có đúng một <code>&lt;h1&gt;</code>; kiểm tra cây heading như mục lục của một cuốn sách."],"crit":["Đã đủ khi bạn duyệt được toàn bộ một trang chỉ bằng bàn phím và mở được a11y tree trong DevTools để giải thích cấu trúc của nó.","Mọi phần tử tương tác đều là thẻ native đúng vai trò, không còn <code>&lt;div onClick&gt;</code> giả nút bấm.","Cây heading và landmark phản ánh đúng cấu trúc trang, không nhảy cấp và không thiếu <code>&lt;main&gt;</code>."],"traps":["Dùng <code>&lt;div&gt;</code> hoặc <code>&lt;span&gt;</code> rồi vá bằng <code>role=\"button\"</code> và listener thay vì dùng thẳng <code>&lt;button&gt;</code>.","Chọn heading theo cỡ chữ mong muốn (nhảy từ <code>&lt;h1&gt;</code> xuống <code>&lt;h4&gt;</code> cho đẹp) thay vì theo thứ bậc nội dung.","Dùng <code>&lt;a href=\"#\"&gt;</code> cho một hành động trong trang, khiến screen reader đọc nhầm nó là liên kết điều hướng."]},"10.02":{"goals":["Thuộc quy tắc số 1 của ARIA: không dùng ARIA nếu đã có HTML native làm được.","Phân biệt vai trò của <code>aria-label</code>, <code>aria-labelledby</code>, <code>aria-describedby</code>.","Dùng đúng <code>aria-live</code> để thông báo cập nhật động và các state như <code>aria-expanded</code>, <code>aria-selected</code>.","Hiểu rằng ARIA chỉ đổi ngữ nghĩa chứ không thêm hành vi — keyboard vẫn phải tự code."],"tasks":["Rà một component đang rắc ARIA và gỡ mọi thuộc tính thừa mà thẻ native đã tự cung cấp (ví dụ <code>role=\"button\"</code> trên một <code>&lt;button&gt;</code>).","Gắn tên cho một nút chỉ có icon bằng <code>aria-label</code>, và liên kết một input với tiêu đề nhóm của nó bằng <code>aria-labelledby</code>.","Tạo một vùng <code>aria-live=\"polite\"</code> và cập nhật nội dung nó khi có sự kiện (ví dụ 'Đã lưu', 'Có 3 kết quả'), rồi nghe screen reader đọc.","Thêm <code>aria-expanded</code> cho một nút toggle và cập nhật giá trị true/false đồng bộ với trạng thái đóng/mở thực tế.","Chạy axe DevTools trên component để xác nhận không sinh ra ARIA sai hoặc dư thừa."],"hints":["Trước khi thêm bất kỳ <code>role</code> hay <code>aria-*</code> nào, tự hỏi: có thẻ HTML nào làm sẵn việc này không?","<code>aria-label</code> ghi đè text hiển thị của phần tử, nên đừng dùng cho phần tử đã có nhãn nhìn thấy được — hãy dùng <code>aria-labelledby</code> để trỏ tới nhãn đó.","<code>aria-live=\"polite\"</code> cho thông báo không khẩn; chỉ dùng <code>assertive</code> cho lỗi cần cắt ngang.","Nếu thêm <code>aria-expanded</code> mà nút không tự đóng/mở được bằng bàn phím, nhớ rằng ARIA không code hành vi hộ bạn."],"crit":["Đã đủ khi bạn giải thích được vì sao 'no ARIA is better than bad ARIA' và dùng được <code>aria-live</code> cho một cập nhật động mà screen reader đọc đúng.","Mọi thuộc tính ARIA còn lại đều cần thiết và không trùng lặp với ngữ nghĩa native của thẻ.","Các state như <code>aria-expanded</code> luôn đồng bộ với trạng thái thực của UI, không bao giờ lệch."],"traps":["Đặt <code>role</code> trùng với vai trò native (ví dụ <code>role=\"button\"</code> lên <code>&lt;button&gt;</code>, <code>role=\"navigation\"</code> lên <code>&lt;nav&gt;</code>).","Tưởng thêm <code>role=\"tab\"</code> hay <code>aria-selected</code> là component tự chạy được bằng bàn phím, quên rằng phải tự viết keyboard handler.","Để giá trị <code>aria-expanded</code> hard-code cố định hoặc cập nhật lệch pha với trạng thái đóng/mở."]},"10.03":{"goals":["Hiểu thứ tự Tab theo DOM và vì sao <code>tabindex &gt; 0</code> là anti-pattern.","Cài đặt được focus trap trong modal/dialog và trả focus về trigger khi đóng.","Xử lý Esc để thoát dialog và ngăn focus rơi ra nền phía sau.","Biết áp dụng roving tabindex cho menu/list và thêm skip-link cho điều hướng nhanh."],"tasks":["Viết một modal tự quản focus: khi mở, chuyển focus vào phần tử đầu tiên bên trong modal.","Cài focus trap để Tab và Shift+Tab chỉ vòng trong modal, không bao giờ chạy ra phần tử phía sau nền.","Gắn phím Esc để đóng modal, và khi đóng thì trả focus về đúng nút đã mở nó.","Chuyển một menu hoặc danh sách sang roving tabindex: chỉ một item có <code>tabindex=\"0\"</code>, các phím mũi tên di chuyển focus giữa các item.","Thêm một skip-link ở đầu trang cho phép nhảy thẳng tới <code>&lt;main&gt;</code>, và kiểm tra nó hiện ra khi được focus."],"hints":["Lưu lại phần tử đang focus (<code>document.activeElement</code>) ngay trước khi mở modal để còn trả focus về đúng chỗ khi đóng.","Để trap focus, chặn Tab tại phần tử focusable cuối và Shift+Tab tại phần tử đầu, rồi vòng lại.","Đừng dùng <code>tabindex</code> dương để ép thứ tự — hãy sắp xếp lại thứ tự DOM cho đúng.","Roving tabindex: các item không active dùng <code>tabindex=\"-1\"</code>, chỉ item hiện tại là <code>tabindex=\"0\"</code>."],"crit":["Đã đủ khi một modal tự viết quản focus đúng: trap khi mở, Esc đóng, và trả focus về đúng nút đã mở nó.","Không có phím Tab nào thoát ra được phần tử phía sau nền khi modal đang mở.","Menu dùng roving tabindex điều hướng mượt bằng phím mũi tên và chỉ tốn một lần Tab để vào nhóm."],"traps":["Mở modal mà không chuyển focus vào trong, khiến người dùng bàn phím vẫn kẹt ở nền.","Quên trả focus về trigger khi đóng, làm mất ngữ cảnh và focus nhảy về đầu trang.","Lạm dụng <code>tabindex=\"1\"</code>, <code>tabindex=\"2\"</code> để sắp thứ tự, phá vỡ luồng Tab tự nhiên của cả trang."]},"10.04":{"goals":["Trải nghiệm thật một screen reader (VoiceOver trên Mac) duyệt app của chính mình.","Kết hợp kiểm thử tự động (axe DevTools, <code>eslint-plugin-jsx-a11y</code>) với kiểm thử thủ công (keyboard-only, contrast).","Hiểu WCAG ở mức thực dụng qua bốn trụ perceivable, operable, understandable, robust.","Làm form accessible: label liên kết đúng và lỗi nối vào input bằng <code>aria-describedby</code>."],"tasks":["Bật VoiceOver (Cmd+F5 trên Mac) và duyệt một trang app của bạn bằng rotor và phím tắt, ghi lại chỗ nào screen reader đọc khó hiểu.","Chạy axe DevTools trên một trang và sửa cho tới khi không còn lỗi (0 violations).","Cài <code>eslint-plugin-jsx-a11y</code> vào project và xử lý các cảnh báo nó báo trong code JSX.","Kiểm tra contrast màu chữ/nền theo palette Phase 04, đảm bảo đạt ngưỡng WCAG AA (4.5:1 cho text thường).","Làm một form có label liên kết đúng qua <code>&lt;label for&gt;</code> và thông báo lỗi nối vào input bằng <code>aria-describedby</code>, rồi điền form đó chỉ bằng bàn phím và screen reader."],"hints":["Trong VoiceOver, dùng rotor (VO+U) để duyệt nhanh theo heading, link, form control — nếu danh sách đó rối nghĩa là cấu trúc trang đang sai.","axe không bắt được mọi thứ; luôn bổ sung một lượt kiểm thủ công chỉ bằng bàn phím.","Với contrast, dùng thẳng công cụ trong DevTools (color picker hiện tỉ lệ tương phản) thay vì đoán bằng mắt.","Lỗi form nên được đọc ngay cho screen reader — kết hợp <code>aria-describedby</code> trỏ tới thông báo lỗi với vùng <code>aria-live</code>."],"crit":["Đã đủ khi bạn chạy axe sạch lỗi trên một trang và điều hướng được form đó bằng screen reader kết hợp chỉ bàn phím.","Mọi input trong form đều có label liên kết đúng và lỗi được nối tới input để screen reader đọc.","Các cặp màu chữ/nền quan trọng đều đạt ngưỡng WCAG AA về contrast."],"traps":["Coi axe pass là 'đã accessible' và bỏ qua kiểm thử thủ công bằng bàn phím và screen reader.","Dùng placeholder thay cho label, khiến trường trống là mất luôn nhãn và screen reader không đọc được tên field.","Báo lỗi form chỉ bằng màu đỏ mà không có text liên kết qua <code>aria-describedby</code>, nên người dùng screen reader không biết lỗi ở đâu."]},"11.01":{"goals":["Phân biệt được khi nào dùng compound components thay vì thêm prop cấu hình.","Hiểu nguyên tắc headless: tách logic/hành vi khỏi giao diện để tái dùng.","Nắm được khác biệt giữa controlled và uncontrolled API và khi nào dùng cái nào.","Thiết kế được API component đọc tự nhiên, khó dùng sai, dễ mở rộng."],"tasks":["Chọn một component \"God-props\" hiện có (ví dụ <code>&lt;Button&gt;</code> hay <code>&lt;Select&gt;</code> với 20+ props) và liệt kê đủ props ra một bảng, đánh dấu prop nào chồng chéo hoặc loại trừ lẫn nhau.","Thiết kế lại thành compound component: tách <code>&lt;Select&gt;</code>, <code>&lt;Select.Trigger&gt;</code>, <code>&lt;Select.Option&gt;</code> chia sẻ state qua <code>Context</code> thay vì truyền props xuống nhiều tầng.","Tách phần logic (mở/đóng, chọn item, điều hướng bàn phím) thành một hook headless <code>useSelect()</code> không chứa bất kỳ style nào, rồi ráp UI riêng lên trên.","Cung cấp cả hai chế độ controlled (<code>value</code> + <code>onChange</code>) và uncontrolled (<code>defaultValue</code>), viết một ví dụ dùng mỗi chế độ.","Viết 2 ví dụ sử dụng trước/sau để chứng minh cùng nhu cầu nhưng API mới ngắn và rõ hơn."],"hints":["Nếu một prop chỉ có ý nghĩa khi prop khác bật, đó là dấu hiệu nên tách thành compound.","Đọc source của Radix UI hoặc Headless UI để thấy cách họ tách logic khỏi style.","Dùng <code>Context</code> nội bộ để các thành phần con tìm state, tránh prop drilling.","Đừng để component vừa controlled vừa uncontrolled cùng một prop — chọn một nguồn sự thật."],"crit":["Đã đủ khi bạn thiết kế lại một component \"God-props\" thành compound/headless mà vẫn linh hoạt hơn bản cũ.","API mới không còn cặp props loại trừ lẫn nhau; các trạng thái vô nghĩa không thể biểu diễn được.","Logic tái dùng được qua hook headless, chứng minh bằng ít nhất hai giao diện khác nhau dùng chung logic."],"traps":["Biến compound thành phức tạp hơn cần thiết — tách thành phần con cho cả những thứ không bao giờ dùng riêng.","Rò rỉ chi tiết style vào lớp headless, khiến logic không thực sự tái dùng được.","Trộn controlled và uncontrolled trên cùng một prop, gây warning React và hành vi khó đoán."]},"11.02":{"goals":["Đóng gói được một thư viện component publish được, nhiều team import dùng.","Dùng Storybook làm tài liệu sống kèm test tương tác và kiểm a11y.","Hiểu semver, changelog và quy trình versioning cho một package chia sẻ.","Thiết lập token pipeline giữ design (Figma) và code đồng bộ."],"tasks":["Cấu hình build ra ESM tree-shakable với <code>\"sideEffects\": false</code> và <code>exports</code> map trong <code>package.json</code>, kiểm tra bundle không kéo theo component không dùng.","Viết Storybook cho ít nhất 3 component, mỗi component có story các trạng thái chính và một interaction test qua <code>play()</code>.","Bật a11y addon trong Storybook và sửa hết các vi phạm nghiêm trọng nó báo trên các story.","Thiết lập semver + changelog (ví dụ Changesets), tạo một version <code>1.0.0</code> và publish lên registry (npm hoặc registry nội bộ).","Trong một project khác, import package vừa publish và render thành công một component để chứng minh nó dùng được."],"hints":["Dùng <code>tsup</code> hoặc <code>Vite lib mode</code> để build ESM nhanh mà vẫn giữ tree-shaking.","Changesets tự sinh changelog và bump version theo commit, đỡ phải làm tay.","Style Dictionary chuyển token nguồn thành CSS variables và cả file Figma cùng lúc.","Nếu import bị lỗi \"cannot find module\", kiểm tra field <code>exports</code> và <code>types</code> trong package.json."],"crit":["Đã đủ khi bạn publish được một package component có Storybook, được versioned, và một team khác import dùng được.","Bundle tree-shakable: import một component không kéo theo cả thư viện, kiểm chứng bằng bundle analyzer.","Mỗi lần đổi API đều có changelog và bump version đúng semver (breaking → major)."],"traps":["Publish bundle CommonJS khiến tree-shaking chết, người dùng kéo cả thư viện vào bundle.","Quên khai báo <code>peerDependencies</code> cho React, gây lỗi nhiều bản React trong cùng app.","Bump version tùy tiện: đưa breaking change vào bản patch/minor, làm vỡ app team khác."]},"11.03":{"goals":["Hiểu cách monorepo chia package, quản ranh giới phụ thuộc và cache build.","Nắm được task graph để chỉ build/test lại phần bị ảnh hưởng.","Hiểu micro-frontends và Module Federation: khi nào đáng và cái giá phải trả.","Biết định nghĩa contract giữa các phần (types chung, versioning API nội bộ)."],"tasks":["Dựng một monorepo (Turborepo hoặc Nx) với ít nhất 2 app và 1 package <code>ui</code> dùng chung, cấu hình <code>pipeline</code>/task graph để build có thứ tự đúng.","Bật remote/local cache và đo thời gian build lần hai so với lần đầu để chứng minh cache có tác dụng.","Thiết lập ranh giới phụ thuộc (ví dụ ESLint boundaries hoặc Nx tags) chặn app import trực tiếp internal của app khác.","Dựng một demo Module Federation cho một widget chia sẻ giữa 2 app, ghi lại kích thước bundle trùng lặp.","Viết một trang so sánh monorepo vs micro-frontend cho một bối cảnh tổ chức cụ thể (số team, nhịp deploy), kết luận rõ chọn cái nào và vì sao."],"hints":["Bắt đầu bằng monorepo trước; chỉ cân nhắc micro-frontend khi các team thật sự cần deploy độc lập.","Cache của Turborepo dựa trên hash input; nếu cache luôn miss, kiểm tra input/output khai báo trong task.","Với Module Federation, dùng <code>shared</code> để tránh nạp hai lần React/thư viện chung.","Type chung nên nằm ở một package riêng để tránh phụ thuộc vòng giữa các app."],"crit":["Đã đủ khi bạn biện hộ được lựa chọn monorepo vs micro-frontend cho một bối cảnh tổ chức cụ thể, với trade-off rõ ràng.","Task graph chạy đúng thứ tự và cache thực sự bỏ qua công việc không đổi (đo được bằng thời gian).","Ranh giới phụ thuộc được thực thi tự động: một import vi phạm bị công cụ báo lỗi, không chỉ nằm trong quy ước."],"traps":["Chọn micro-frontend chỉ vì \"nghe hiện đại\" trong khi một team và monorepo là đủ, gánh phức tạp vô ích.","Không khai báo đúng input/output cho task, khiến cache luôn miss hoặc trả kết quả cũ sai.","Bundle trùng lặp trong micro-frontend (mỗi remote gói riêng React) làm phình kích thước tải về."]},"11.04":{"goals":["Có khung phân tích đầu-cuối cho một bài thiết kế hệ thống frontend.","Chọn được render strategy và state strategy phù hợp với yêu cầu bài toán.","Áp dụng kỹ thuật quy mô: virtualization, caching, debounce/cancel, optimistic update.","Gọi tên trade-off ở mỗi lớp và đo hiệu năng bằng RUM."],"tasks":["Chọn một case (infinite feed, autocomplete, hoặc real-time chat) và viết ra yêu cầu chức năng + phi chức năng (quy mô user, độ trễ mục tiêu).","Vẽ luồng đầu-cuối: data model → API/giao tiếp (REST/WebSocket) → render strategy → state → cache, chú thích lựa chọn ở từng lớp.","Prototype phần cốt lõi: ví dụ feed thì làm list virtualization + caching trang; autocomplete thì làm debounce + hủy request cũ + cache kết quả.","Xử lý các case khó của bài đã chọn (chat: optimistic update, reconnect, đảm bảo thứ tự tin nhắn) và ghi cách giải quyết.","Gắn đo RUM (ví dụ Web Vitals) cho prototype và ghi lại số đo trước/sau khi tối ưu."],"hints":["Bắt đầu từ yêu cầu, đừng nhảy thẳng vào công nghệ; ràng buộc quy mô quyết định kiến trúc.","Autocomplete: luôn hủy request cũ bằng <code>AbortController</code> để tránh kết quả về trễ ghi đè kết quả mới.","Feed dài: virtualization giữ DOM nhỏ; kết hợp cache theo trang để cuộn ngược không gọi lại API.","Chat real-time: gán id tạm cho tin nhắn optimistic rồi hòa giải khi server trả về, xử lý reconnect và dedup."],"crit":["Đã đủ khi bạn trình bày được thiết kế đầu-cuối cho một case, gọi tên trade-off ở mỗi lớp.","Prototype chạy được phần cốt lõi và giữ mượt ở quy mô lớn (feed dài không giật, autocomplete không đua request).","Có số đo hiệu năng bằng RUM chứng minh tối ưu thực sự cải thiện, không chỉ suy đoán."],"traps":["Nhảy vào chọn thư viện trước khi làm rõ yêu cầu và ràng buộc quy mô.","Autocomplete không hủy request cũ, gây kết quả cũ về sau ghi đè kết quả đúng (race condition).","Render cả danh sách dài không virtualization, khiến DOM phình và trang giật khi cuộn."]},"11.05":{"goals":["Viết được RFC/ADR trình bày quyết định kiến trúc để team phản biện.","Dẫn dắt code review ở tầng kiến trúc và khả năng bảo trì, không chỉ bắt lỗi cú pháp.","Quản tech debt có chủ đích: quyết định nợ nào trả, nợ nào chấp nhận.","Thực hành mentor và dẫn dắt một migration lớn có kế hoạch."],"tasks":["Chọn một quyết định kỹ thuật thật đang cần và viết RFC gồm: bối cảnh, các phương án, trade-off từng phương án, đề xuất chọn và lý do.","Gửi RFC cho ít nhất một đồng đội đọc, thu phản biện và ghi lại phần điều chỉnh sau feedback.","Viết một ADR ngắn ghi lại \"vì sao\" của một quyết định đã chốt, lưu vào repo để người sau tra cứu.","Làm một buổi code review tập trung vào kiến trúc/khả năng bảo trì một PR, để lại nhận xét có tính dẫn dắt chứ không chỉ chỉ lỗi.","Lập một bảng tech debt: liệt kê các khoản nợ, đánh giá rủi ro/chi phí, và đề xuất khoản nào trả trước, khoản nào tạm chấp nhận kèm lý do."],"hints":["RFC tốt trình bày cả phương án mình không chọn và lý do loại, để người đọc tin quyết định đã cân nhắc kỹ.","ADR nên ngắn: bối cảnh, quyết định, hệ quả — đủ để người sau hiểu \"vì sao\", không cần dài dòng.","Trong review kiến trúc, hỏi \"cái này sẽ khó bảo trì ở đâu sau 6 tháng?\" thay vì chỉ soi style.","Không phải nợ nào cũng phải trả; nợ có chủ đích kèm lý do rõ là quyết định trưởng thành."],"crit":["Đã đủ khi bạn viết được một RFC cho quyết định kỹ thuật thật (có bối cảnh, phương án, trade-off, đề xuất) mà đồng đội đọc hiểu và phản biện được.","RFC/ADR ghi lại \"vì sao\" đủ rõ để người không dự cuộc thảo luận vẫn hiểu quyết định.","Bảng tech debt phân biệt được nợ nên trả và nợ chấp nhận, mỗi khoản có lý do rõ ràng."],"traps":["Viết RFC chỉ nêu một phương án đã chọn, bỏ qua các lựa chọn khác nên team không có gì để phản biện.","Code review chỉ bắt lỗi cú pháp/style mà bỏ qua rủi ro kiến trúc và khả năng bảo trì dài hạn.","Coi mọi tech debt đều xấu và đòi trả hết, làm chậm việc giao hàng thay vì ưu tiên theo rủi ro."]},"12.01":{"goals":["Hiểu <code>flex: 1</code> thực sự là gì (viết tắt của <code>flex-grow</code>/<code>flex-shrink</code>/<code>flex-basis</code>).","Phân biệt rõ khi nào dùng Flexbox (luồng 1 chiều) và khi nào dùng Grid (lưới 2 chiều).","Làm chủ <code>grid-template</code>, đơn vị <code>fr</code>, <code>minmax()</code> và cặp <code>auto-fit</code>/<code>auto-fill</code>.","Canh chỉnh trục chính/trục phụ bằng <code>justify-content</code>, <code>align-items</code> mà không cần hack margin.","Dựng được layout dashboard hoàn chỉnh chỉ bằng Flex/Grid, không đụng tới <code>float</code>/<code>position</code> chắp vá."],"tasks":["Dựng một sidebar co giãn bằng Flexbox: sidebar cố định <code>flex-basis</code>, phần nội dung <code>flex: 1</code> chiếm phần còn lại.","Tạo lưới card responsive bằng <code>grid-template-columns: repeat(auto-fit, minmax(240px, 1fr))</code> và kiểm tra số cột tự đổi khi thu hẹp cửa sổ.","Dùng <code>grid-template-areas</code> đặt tên các vùng (header/sidebar/main/footer) rồi map từng phần tử vào <code>grid-area</code>.","Viết ra 3 ví dụ thay đổi <code>flex-grow</code>, <code>flex-shrink</code>, <code>flex-basis</code> và ghi lại tác động thực tế lên chiều rộng phần tử.","So sánh cùng một layout viết bằng Flex và bằng Grid, ghi lại cách nào ngắn gọn và ít hack hơn cho từng trường hợp."],"hints":["Khi flex item bị tràn, kiểm tra <code>min-width: 0</code> vì mặc định <code>min-width: auto</code> chặn co lại.","So sánh <code>auto-fit</code> (thu cột rỗng) và <code>auto-fill</code> (giữ track rỗng) trực tiếp trên cùng một lưới để thấy khác biệt.","Dùng DevTools bật overlay Grid/Flex để nhìn được đường track và khoảng gap thay vì đoán.","Nếu chỉ canh theo một hàng hoặc một cột thì gần như luôn là Flexbox, đừng vội với tay sang Grid."],"crit":["Dựng được layout dashboard phức tạp (sidebar co giãn, grid card responsive) chỉ bằng Flex/Grid, không hack margin/float/position.","Giải thích được từng giá trị trong <code>flex: 1</code> và dự đoán đúng hành vi khi đổi các thành phần.","Chọn đúng Flex hay Grid cho mỗi phần của layout và nêu được lý do một chiều hay hai chiều."],"traps":["Lạm dụng Grid cho mọi thứ kể cả luồng một chiều đơn giản, làm code khó đọc hơn cần thiết.","Quên <code>min-width: 0</code>/<code>min-height: 0</code> nên flex/grid item không chịu co lại và gây tràn.","Nhầm <code>fr</code> với phần trăm: <code>fr</code> chia phần dư sau khi trừ gap và track cố định, không phải chia tổng."]},"12.02":{"goals":["Hiểu container queries responsive theo container thay vì viewport để component tái dùng thật sự.","Dùng <code>clamp()</code>, <code>min()</code>, <code>max()</code> làm type và spacing co giãn mượt không cần breakpoint cứng.","Nắm logical properties (<code>inline</code>/<code>block</code>) để layout đúng cả trong ngữ cảnh RTL.","Áp dụng <code>aspect-ratio</code> và tư duy mobile-first cho component thích ứng."],"tasks":["Khai báo <code>container-type: inline-size</code> trên phần tử cha rồi viết <code>@container</code> để card đổi layout theo bề rộng container.","Đặt cùng card đó vào 2 container rộng hẹp khác nhau và xác nhận nó tự thích ứng độc lập với viewport.","Viết <code>font-size: clamp(1rem, 2.5vw + 0.5rem, 2rem)</code> cho tiêu đề và kiểm tra type co giãn mượt khi kéo cửa sổ.","Thay các cặp <code>margin-left</code>/<code>margin-right</code> bằng <code>margin-inline</code> rồi bật <code>dir=\"rtl\"</code> để xác nhận layout tự lật đúng.","Giữ tỉ lệ khung ảnh/khối bằng <code>aspect-ratio</code> và kiểm tra không còn nhảy layout khi nội dung tải."],"hints":["Nhớ container query cần một phần tử cha khai báo <code>container-type</code>, phần tử tự nó không tự query chính mình.","Với <code>clamp(min, preferred, max)</code> hãy trộn đơn vị tương đối như <code>vw</code> cộng <code>rem</code> để vừa mượt vừa có cận an toàn.","Dùng <code>container-name</code> khi có nhiều container lồng nhau để chỉ đích danh cái cần query.","Khi bí về RTL, thử lật <code>dir</code> ngay trên <code>html</code> và quan sát, đừng suy luận thuần lý thuyết."],"crit":["Một card component tự thích ứng theo container (không phải viewport) và type co giãn mượt bằng <code>clamp()</code>.","Layout dùng logical properties chạy đúng cả LTR lẫn RTL mà không phải viết lại CSS.","Không còn media query cứng cho các khoảng giữa mà vẫn mượt nhờ hàm fluid."],"traps":["Quên đặt <code>container-type</code> trên cha nên <code>@container</code> không có tác dụng và tưởng tính năng lỗi.","Đặt giá trị preferred trong <code>clamp()</code> chỉ dùng đơn vị tuyệt đối, làm mất tính co giãn mong muốn.","Vẫn dùng <code>left</code>/<code>right</code> cứng nên layout vỡ ngay khi chuyển sang RTL."]},"12.03":{"goals":["Dùng <code>:has()</code> như parent selector để thay thế nhiều đoạn JS chọn theo con.","Kiểm soát độ ưu tiên có chủ đích bằng cascade layers (<code>@layer</code>) thay cho <code>!important</code>.","Nắm CSS nesting native, subgrid và cặp <code>:is()</code>/<code>:where()</code> để rút gọn selector.","Sử dụng custom properties nâng cao gắn với design tokens một cách nhất quán."],"tasks":["Chọn một đoạn JS đang thêm/bớt class cha theo con và thay bằng một selector <code>:has()</code> tương đương.","Khai báo thứ tự <code>@layer reset, base, components, utilities</code> rồi đặt CSS vào từng layer để kiểm soát cascade rõ ràng.","Tái tạo một xung đột specificity cũ và giải quyết nó bằng cascade layers thay vì thêm <code>!important</code>.","Viết lại một khối selector lồng nhau bằng CSS nesting native và kiểm tra kết quả render không đổi.","Dùng <code>:where()</code> cho selector nền tảng để giữ specificity bằng 0, giúp người dùng dễ override."],"hints":["<code>:has()</code> tính theo phần tử đứng trước nó, hãy đọc selector là chọn cha mà bên trong có phần con thoả điều kiện.","CSS trong layer đứng sau luôn thắng layer đứng trước bất kể specificity, thứ tự khai báo layer là chìa khoá.","<code>:is()</code> lấy specificity cao nhất trong nhóm còn <code>:where()</code> luôn bằng 0, chọn đúng cái cho ý đồ.","Nếu <code>:has()</code> không chạy, kiểm tra trình duyệt mục tiêu và cân nhắc fallback tiến bộ dần."],"crit":["Thay được một đoạn JS bằng <code>:has()</code>, và dùng <code>@layer</code> để kiểm soát cascade thay vì <code>!important</code>.","Giải thích được vì sao layer quyết định thắng thua trước cả specificity.","Phân biệt và dùng đúng <code>:is()</code> với <code>:where()</code> theo ý đồ specificity."],"traps":["Lạm dụng <code>:has()</code> cho selector quá phức tạp làm CSS khó đọc và tốn hiệu năng.","Trộn lẫn CSS trong layer và ngoài layer mà không nhớ rằng CSS ngoài layer luôn thắng CSS trong layer.","Vẫn rải <code>!important</code> để chữa cháy trong khi cascade layers đã giải quyết gọn hơn."]},"12.04":{"goals":["So sánh được BEM, CSS Modules, Tailwind, CSS-in-JS và zero-runtime theo trade-off runtime/DX/bundle.","Hiểu cơ chế scoping và cách tránh rò rỉ style ra global.","Nắm cách loại bỏ dead code CSS trong dự án lớn.","Biết chọn styling strategy phù hợp với quy mô team và loại dự án."],"tasks":["Lập bảng so sánh 5 chiến lược (BEM, CSS Modules, Tailwind, CSS-in-JS, vanilla-extract) theo cột runtime, DX, bundle size, scoping.","Viết cùng một component bằng ít nhất 2 chiến lược khác nhau và ghi lại khác biệt về DX và cách scoping.","Cấu hình một công cụ loại bỏ CSS thừa (ví dụ purge/tree-shake) và đo thay đổi kích thước bundle trước/sau.","Chọn một dự án giả định (quy mô, team, yêu cầu hiệu năng cụ thể) và viết đoạn biện hộ lựa chọn strategy.","Chỉ ra một ví dụ global leak thực tế và mô tả cách chiến lược đã chọn ngăn được nó."],"hints":["Không có chiến lược tốt nhất tuyệt đối, hãy neo quyết định vào ràng buộc cụ thể của dự án và team.","CSS-in-JS runtime trả giá bằng hiệu năng lúc chạy còn zero-runtime đẩy chi phí sang lúc build, cân theo nhu cầu.","Utility-first như Tailwind mạnh về nhất quán và dead-code elimination nhưng cần quy ước để tránh rối markup.","Nối lại bài design system ở 11.02 khi cân nhắc khả năng chia sẻ style giữa nhiều sản phẩm."],"crit":["Biện hộ được lựa chọn styling strategy cho một dự án cụ thể với trade-off rõ ràng.","Nêu đúng cơ chế scoping của từng chiến lược và cách nó chặn global leak.","Chỉ ra được cách dự án loại bỏ dead code CSS và bằng chứng đo lường trước/sau."],"traps":["Chọn công nghệ theo trend thay vì theo ràng buộc thực tế của team và dự án.","Bỏ qua chi phí runtime của CSS-in-JS trên trang nặng, gây chậm mà không nhận ra nguyên nhân.","Tin rằng chỉ cần framework là hết lo global leak mà không thiết lập scoping đúng."]},"12.05":{"goals":["Dùng <code>object-fit</code> và <code>object-position</code> cho <code>&lt;img&gt;</code> vừa khung mà không méo.","Phân biệt khi nào dùng <code>&lt;img&gt;</code> (nội dung thật, cần a11y/SEO) và khi nào dùng background (trang trí).","Giữ tỉ lệ khung bằng <code>aspect-ratio</code> để chống CLS và làm ảnh responsive đúng cách.","Nắm các kỹ thuật ảnh nâng cao bằng CSS: overlay gradient, <code>filter</code>/<code>backdrop-filter</code>, blur/placeholder."],"tasks":["Đặt một ảnh bất kỳ vào khung cố định và dùng <code>object-fit: cover</code> để lấp đầy không méo, rồi thử <code>contain</code> để thấy khác biệt.","Chỉnh điểm neo bằng <code>object-position</code> để giữ chủ thể (ví dụ khuôn mặt trong avatar) không bị cắt mất.","Áp <code>aspect-ratio</code> cho khung ảnh và xác nhận không còn nhảy layout (CLS) khi ảnh tải xong.","Làm ảnh responsive bằng <code>max-width: 100%; height: auto</code> và kiểm tra không tràn trên màn nhỏ.","Tạo một overlay ảnh (gradient chồng lên image) và thử <code>filter</code>/<code>backdrop-filter</code> cho hiệu ứng blur/placeholder."],"hints":["<code>object-fit</code> chỉ tác dụng lên phần tử thay thế như <code>&lt;img&gt;</code>/<code>&lt;video&gt;</code>, không dùng cho background.","Với background dùng cặp <code>background-size: cover</code> và <code>background-position</code>; với <code>&lt;img&gt;</code> dùng <code>object-fit</code>/<code>object-position</code>.","Quy tắc chọn: nội dung có ý nghĩa cần alt/SEO thì dùng <code>&lt;img&gt;</code>, còn trang trí thuần thì để background.","Bật <code>image-rendering: pixelated</code> khi phóng to pixel art để tránh bị làm mờ."],"crit":["Đặt được ảnh bất kỳ vào khung cố định không méo/không tràn bằng <code>object-fit</code>, giữ đúng tỉ lệ bằng <code>aspect-ratio</code>, và chọn đúng <code>&lt;img&gt;</code> vs background theo ngữ cảnh.","Avatar/thumbnail giữ được chủ thể nhờ <code>object-position</code> thay vì bị cắt tuỳ tiện.","Ảnh responsive không tràn khung trên mọi kích thước và không gây nhảy layout khi tải."],"traps":["Đặt <code>width</code> và <code>height</code> cứng cho <code>&lt;img&gt;</code> mà không dùng <code>object-fit</code> nên ảnh bị méo tỉ lệ.","Dùng background cho nội dung thật khiến mất alt text và ảnh hưởng a11y/SEO.","Bỏ qua <code>aspect-ratio</code> hoặc kích thước khung nên ảnh gây CLS khi tải xong."]},"13.01":{"goals":["Phân biệt được Socket.IO với WebSocket thô: auto-reconnect, rooms, namespaces, acknowledgement, fallback long-polling.","Hiểu kiến trúc room cho chat/notification theo nhóm và cách broadcast vs emit tới room.","Nắm được cái giá phải trả khi dùng Socket.IO và biết khi nào chọn nó thay vì WS thô.","Dùng được acknowledgement callback để xác nhận server đã nhận message.","Xử lý được vòng đời kết nối: <code>connect</code>, <code>disconnect</code>, reconnect tự động."],"tasks":["Dựng server Socket.IO tối thiểu và client kết nối, log ra khi sự kiện <code>connect</code> và <code>disconnect</code> bắn.","Cho client <code>join</code> một room theo tên, rồi dùng <code>io.to(room).emit()</code> để chỉ broadcast tới thành viên phòng đó, kiểm chứng client ngoài phòng không nhận.","Gửi một message có acknowledgement: client truyền callback vào <code>socket.emit('msg', data, cb)</code> và server gọi <code>cb(ack)</code>, đo được callback chạy đúng một lần.","Tách logic sang một <code>namespace</code> riêng (ví dụ <code>/chat</code>) và xác nhận sự kiện của namespace này không rò sang namespace mặc định.","Tắt mạng hoặc kill server 3 giây rồi bật lại, quan sát client tự reconnect mà không cần reload trang."],"hints":["Nếu client không nhận broadcast, kiểm tra bạn đã <code>join</code> đúng tên room trước khi emit chưa — room được tạo ngầm khi có socket join.","Acknowledgement chỉ chạy nếu server thực sự gọi callback nhận được ở tham số cuối; đừng quên tham số này ở phía server.","Muốn debug fallback long-polling, mở tab Network và xem transport có nhảy từ <code>polling</code> sang <code>websocket</code> không.","Reconnect có backoff mặc định; đừng vội kết luận là hỏng khi nó chờ vài giây mới nối lại."],"crit":["Đã đủ khi dựng được demo chat nhiều phòng với ack chạy đúng, và giải thích được khi nào chọn Socket.IO thay vì WebSocket thô.","Broadcast tới đúng room và namespace, client ngoài phạm vi không nhận nhầm message.","Client tự reconnect sau khi mất kết nối mà không cần thao tác thủ công."],"traps":["Tưởng Socket.IO client nối được vào một WebSocket server chuẩn — không được, nó cần server Socket.IO vì có protocol riêng.","Dùng <code>socket.broadcast.emit</code> khi thực ra muốn gửi tới một room cụ thể, khiến message lọt sang cả người ngoài phòng.","Đăng ký handler sự kiện nhiều lần sau mỗi reconnect, dẫn tới message bị xử lý trùng lặp."]},"13.02":{"goals":["Hiểu SSE (EventSource): 1 chiều server→client, tự reconnect, chạy trên HTTP thường — và khi nào đủ dùng.","Nắm khái niệm WebRTC: P2P audio/video, data channel, signaling, STUN/TURN, ICE và luồng kết nối.","Lập được bảng so sánh polling / SSE / WebSocket / Socket.IO / WebRTC để chọn công cụ đúng.","Biết giới hạn của SSE (1 chiều, số kết nối trên HTTP/1.1) để không chọn sai.","Hiểu vai trò của signaling server dù dữ liệu WebRTC đi P2P."],"tasks":["Dựng một endpoint SSE trả <code>Content-Type: text/event-stream</code>, đẩy một event mỗi giây; client dùng <code>new EventSource(url)</code> và render số liệu cập nhật.","Ngắt server SSE giữa chừng rồi bật lại, xác nhận trình duyệt tự reconnect và log ra <code>Last-Event-ID</code> nếu bạn có gắn <code>id:</code>.","Vẽ sơ đồ luồng WebRTC: hai peer trao đổi SDP offer/answer qua signaling, thu thập ICE candidate, rồi mở data channel.","Lập bảng chọn công cụ cho 4 tình huống: bảng giá live, chat 2 chiều, video call, thông báo server đẩy — ghi rõ chọn gì và vì sao.","Với mỗi công nghệ trong bảng, ghi một dòng về chiều dữ liệu (1 chiều/2 chiều) và có cần server trung gian truyền data không."],"hints":["Nếu SSE không stream mà load một cục, kiểm tra bạn đã tắt buffering và flush response sau mỗi event chưa.","Mỗi message SSE phải kết thúc bằng dòng trống; thiếu dòng trống thì client sẽ không phân tách được event.","WebRTC không có nghĩa là bỏ hẳn server: bạn vẫn cần signaling để trao đổi SDP/ICE trước khi P2P chạy.","STUN chỉ giúp tìm địa chỉ public; khi NAT chặt bạn cần TURN để relay, đừng nhầm hai vai trò này."],"crit":["Đã đủ khi chọn đúng công nghệ real-time cho 4 tình huống khác nhau và giải thích được, đồng thời dựng một luồng SSE chạy được.","Endpoint SSE stream đúng định dạng và client tự reconnect khi đứt kết nối.","Sơ đồ WebRTC thể hiện đúng vai trò signaling, ICE và data/media channel."],"traps":["Dùng WebSocket cho thứ chỉ cần server đẩy 1 chiều, gánh phức tạp trong khi SSE đã đủ.","Quên giới hạn 6 kết nối/domain của SSE trên HTTP/1.1, mở quá nhiều tab thì kết nối bị nghẽn.","Tưởng WebRTC là hoàn toàn không cần server nên bỏ luôn TURN, khiến call fail sau NAT/firewall chặt."]},"13.03":{"goals":["Hiểu ba loại thao tác GraphQL: Query, Mutation, Subscription và khái niệm schema, resolver.","Viết được query/mutation có biến (<code>variables</code>) thay vì nhúng cứng giá trị.","Nắm normalized cache của Apollo/urql và cách cache tự cập nhật UI sau mutation.","Hiểu trade-off vs REST: giải over/under-fetch nhưng đổi lấy caching phức tạp, N+1, học phí cao.","Nói được khi nào KHÔNG nên chọn GraphQL."],"tasks":["Viết một query có tham số biến (ví dụ lấy user theo <code>$id</code>) và truyền <code>variables</code> khi gọi, chỉ chọn đúng các field cần.","Viết một mutation cập nhật một bản ghi, quan sát normalized cache tự cập nhật UI mà không cần refetch thủ công.","Với một mutation tạo mới (item chưa có id trong cache), dùng cache update / refetch để danh sách hiển thị đúng — nối tư duy invalidation ở 07.02.","Thử một truy vấn lồng nhiều field để thấy over-fetch/under-fetch của REST được giải thế nào trong một request.","Viết một đoạn ghi chú 3-5 dòng về khi nào GraphQL không đáng dùng cho dự án của bạn."],"hints":["Nếu UI không tự cập nhật sau mutation, kiểm tra mutation có trả về field <code>id</code> để cache normalize và merge đúng object không.","Với tạo mới, cache không tự biết thêm vào list nào — bạn phải chỉ định qua <code>update</code> hoặc refetch query danh sách.","Đừng nhét mọi thứ vào một query khổng lồ; cân nhắc tách để tránh resolver N+1 phía server.","Subscription cần transport riêng (thường WebSocket); đừng kỳ vọng nó chạy trên HTTP query thường."],"crit":["Đã đủ khi viết được query/mutation với biến, hiểu normalized cache cập nhật UI thế nào, và nói được khi nào KHÔNG nên dùng GraphQL.","Mutation cập nhật object phản chiếu ngay lên UI qua cache mà không cần reload.","Trình bày được ít nhất hai trade-off cụ thể so với REST (caching hoặc N+1 hoặc học phí)."],"traps":["Nhúng giá trị cứng vào query string thay vì dùng <code>variables</code>, gây khó tái sử dụng và dễ lỗi inject.","Kỳ vọng cache tự thêm item mới vào danh sách sau mutation tạo mới — phải update cache hoặc refetch thủ công.","Chọn GraphQL cho API nhỏ đơn giản, mua thêm phức tạp caching và N+1 mà không được lợi gì."]},"13.04":{"goals":["Phân biệt OAuth2 (authorization) với OIDC (authentication) — khác nhau ở chỗ nào.","Hiểu luồng Authorization Code + PKCE là flow đúng cho SPA/mobile và vì sao thay implicit flow.","Phân biệt access token, refresh token, ID token và biết lưu mỗi loại ở đâu cho an toàn.","Nắm cơ chế redirect, token exchange và silent refresh.","Hiểu vai trò SSO trong hệ sinh thái OAuth2/OIDC."],"tasks":["Vẽ sơ đồ đầy đủ Authorization Code + PKCE: tạo <code>code_verifier</code>/<code>code_challenge</code>, redirect tới authorization server, nhận <code>code</code>, đổi lấy token.","Đánh dấu trên sơ đồ đâu là access token, đâu là refresh token, đâu là ID token, và mỗi cái dùng để làm gì.","Ghi rõ nơi lưu từng loại token: giải thích vì sao refresh token nên ở cookie httpOnly (nối 05.02) thay vì <code>localStorage</code>.","Mô tả bước silent refresh: khi access token hết hạn thì dùng refresh token đổi token mới ra sao mà không bắt user đăng nhập lại.","Viết một đoạn giải thích vì sao SPA không dùng implicit flow nữa và PKCE chống được kiểu tấn công nào."],"hints":["PKCE ra đời để chống chặn <code>authorization code</code>; <code>code_verifier</code> chỉ client biết nên kẻ chặn code không đổi được token.","Nhớ khác biệt cốt lõi: OIDC thêm ID token (thông tin danh tính) lên trên OAuth2 vốn chỉ lo cấp quyền truy cập.","Đừng lưu token nhạy cảm trong <code>localStorage</code> vì JS đọc được — XSS sẽ lấy sạch.","ID token là để client biết user là ai; đừng dùng nó thay access token để gọi API resource."],"crit":["Đã đủ khi vẽ được sơ đồ Authorization Code + PKCE và giải thích được vì sao SPA không dùng implicit flow nữa.","Phân biệt đúng vai trò và nơi lưu của access/refresh/ID token.","Trình bày được PKCE bảo vệ khỏi tấn công chặn authorization code như thế nào."],"traps":["Nhầm OAuth2 với OIDC, dùng access token để xác định danh tính user thay vì ID token.","Lưu refresh token trong <code>localStorage</code>, biến một lỗ XSS thành chiếm tài khoản vĩnh viễn.","Vẫn dùng implicit flow (token trả thẳng trên URL fragment) dù nó đã lỗi thời và rò token qua lịch sử/log."]},"13.05":{"goals":["Hiểu WebAuthn API: <code>navigator.credentials.create()</code> để đăng ký và <code>.get()</code> để xác thực.","Nắm nguyên lý public-key cryptography: private key nằm ở thiết bị, không bao giờ gửi đi.","Giải thích được vì sao passkey chống phishing, khác mật khẩu và OTP.","Hiểu luồng đăng ký và luồng xác thực passkey ở mức cơ bản.","Biết fallback và UX khi thiết bị không hỗ trợ passkey."],"tasks":["Mô tả luồng đăng ký: server gửi challenge, client gọi <code>navigator.credentials.create()</code>, thiết bị sinh cặp khóa và trả public key + attestation về server lưu.","Mô tả luồng xác thực: server gửi challenge, client gọi <code>navigator.credentials.get()</code>, thiết bị ký challenge bằng private key, server verify bằng public key đã lưu.","Chỉ ra trong luồng điểm mà private key KHÔNG rời thiết bị và điều đó chặn rò rỉ DB thế nào.","Giải thích cơ chế gắn credential với origin khiến passkey không dùng được trên site giả mạo (chống phishing).","Thiết kế fallback UX: phát hiện thiết bị không hỗ trợ WebAuthn và rơi về phương thức đăng nhập khác một cách mượt."],"hints":["Điểm mấu chốt chống phishing: credential bị ràng vào origin, nên site lừa đảo dù giống hệt cũng không lấy được chữ ký hợp lệ.","Server không bao giờ lưu private key; nó chỉ giữ public key và verify chữ ký, nên DB bị lộ cũng không đăng nhập thay được user.","Challenge phải là ngẫu nhiên và dùng một lần để chống replay; đừng tái sử dụng challenge.","Dùng khả năng phát hiện tính năng (feature detection) cho <code>PublicKeyCredential</code> trước khi render nút passkey."],"crit":["Đã đủ khi giải thích được vì sao passkey chống phishing (khác mật khẩu/OTP) và trình bày đúng luồng WebAuthn cơ bản.","Chỉ rõ được private key không rời thiết bị và ý nghĩa bảo mật của điều đó.","Có phương án fallback/UX hợp lý khi thiết bị không hỗ trợ passkey."],"traps":["Tưởng passkey chỉ là mật khẩu lưu trên máy, bỏ qua bản chất public-key và ràng buộc origin.","Tái sử dụng challenge hoặc không xác thực origin phía server, mở đường cho replay/phishing.","Không có fallback, khiến user trên thiết bị/trình duyệt cũ bị kẹt không đăng nhập được."]},"14.01":{"goals":["Hiểu vòng đời một test runner (Vitest/Jest): collect, run, assert, report và cơ chế isolation giữa các test.","Phân biệt rạch ròi mock, stub và spy — mỗi loại giải quyết vấn đề gì và dùng khi nào.","Nắm cách <code>expect</code>/assertion so sánh giá trị và ném lỗi ra sao khi thất bại.","Điều khiển thời gian bằng fake timer để test <code>setTimeout</code>, debounce, throttle mà không phải chờ thật.","Test được code async (promise, callback) một cách xác định, không flaky."],"tasks":["Viết một hàm có <code>setTimeout</code> (ví dụ debounce), rồi test nó bằng <code>vi.useFakeTimers()</code> và <code>vi.advanceTimersByTime()</code> để nhảy thời gian, khẳng định callback chạy đúng số lần.","Tạo một <code>vi.fn()</code> làm spy, truyền vào hàm cần test, rồi khẳng định bằng <code>toHaveBeenCalledTimes</code> và <code>toHaveBeenCalledWith</code>.","Dùng <code>vi.mock()</code> để thay một module phụ thuộc (ví dụ module gọi mạng) và kiểm soát giá trị trả về trong 2 kịch bản: thành công và lỗi.","Viết một ví dụ ngắn cho mỗi loại: mock (thay hẳn implementation), stub (trả giá trị cố định), spy (chỉ theo dõi lời gọi) — kèm chú thích khác biệt.","Đặt <code>beforeEach</code> để reset mock/timer và chứng minh 2 test không rò rỉ state cho nhau (chạy đảo thứ tự vẫn xanh)."],"hints":["Fake timer chỉ có tác dụng nếu bạn gọi <code>vi.useFakeTimers()</code> TRƯỚC khi code tạo timer; nhớ <code>vi.useRealTimers()</code> trong <code>afterEach</code>.","Với promise chạy dưới fake timer, dùng <code>await vi.runAllTimersAsync()</code> thay vì <code>advanceTimersByTime</code> thuần để flush microtask.","Muốn cố định ngày giờ, dùng <code>vi.setSystemTime(new Date('2026-01-01'))</code> thay vì mock <code>Date</code> thủ công.","Nếu mock không ăn, kiểm tra bạn có gọi <code>vi.clearAllMocks()</code> hay <code>mockReset()</code> làm mất implementation đã set không."],"crit":["Đã đủ khi: test được một hàm dùng <code>setTimeout</code> bằng fake timer (không chờ thật) và giải thích được khác biệt mock/stub/spy.","Mỗi test độc lập — chạy riêng lẻ hoặc đảo thứ tự đều xanh, không rò rỉ state hay timer.","Có ít nhất một test cho nhánh lỗi (module mock ném/reject) chứ không chỉ happy path."],"traps":["Quên <code>vi.useRealTimers()</code> sau khi dùng fake timer, khiến test sau bị treo hoặc timeout bí ẩn.","Dùng chờ thật (<code>await sleep(1000)</code>) làm test chậm và flaky thay vì tua thời gian bằng fake timer.","Assert vào chi tiết nội bộ (số lần gọi hàm private) thay vì hành vi quan sát được, khiến test vỡ mỗi lần refactor đúng."]},"14.02":{"goals":["Query DOM theo cách người dùng thấy: dùng role/label thay vì bám <code>data-testid</code> hay class.","Hiểu khác biệt <code>userEvent</code> và <code>fireEvent</code>, và vì sao <code>userEvent</code> giống tương tác thật hơn.","Test UI bất đồng bộ đúng cách với <code>findBy*</code> và <code>waitFor</code>, tránh race condition.","Dùng MSW để chặn request ở tầng network, chia sẻ mock giữa test và môi trường dev.","Viết integration test nối nhiều component với data layer (TanStack Query) chạy cùng nhau."],"tasks":["Cài đặt MSW: khai báo handler cho một endpoint, khởi động server trong <code>beforeAll</code> và <code>server.resetHandlers()</code> trong <code>afterEach</code>.","Viết test cho luồng đầy đủ: component load dữ liệu, hiển thị danh sách, người dùng bấm nút, và một mutation gửi lên — tất cả qua MSW, không mock <code>fetch</code> thủ công.","Dùng <code>screen.getByRole</code>/<code>getByLabelText</code> để lấy phần tử và <code>await userEvent.click()</code> để tương tác thay cho <code>fireEvent</code>.","Dùng <code>await screen.findByText(...)</code> để chờ UI async xuất hiện sau khi request MSW trả về.","Ghi đè một handler trong 1 test để giả lập lỗi 500 và khẳng định UI hiển thị trạng thái lỗi đúng."],"hints":["Nếu dữ liệu không xuất hiện, kiểm tra QueryClient có bị cache giữa các test không — tạo <code>QueryClient</code> mới cho mỗi test và tắt retry.","<code>getBy*</code> ném ngay nếu không thấy; muốn chờ async dùng <code>findBy*</code>; muốn khẳng định KHÔNG có dùng <code>queryBy*</code>.","<code>userEvent</code> trả về promise — luôn <code>await</code> nó, nếu không sự kiện chưa kịp chạy khi bạn assert.","Đặt handler mặc định trong file setup chung để dev server và test dùng chung một bộ mock."],"crit":["Đã đủ khi: test được một luồng \"load → hiển thị → tương tác → mutate\" với MSW mock API, không mock fetch thủ công.","Các query dùng role/label chứ không bám class hay <code>data-testid</code>, và tương tác qua <code>userEvent</code>.","Có ít nhất một kịch bản lỗi (override handler thành 4xx/5xx) khẳng định UI xử lý lỗi đúng."],"traps":["Quên <code>server.resetHandlers()</code> giữa các test khiến handler override rò rỉ sang test sau.","Không <code>await</code> <code>userEvent</code> hoặc <code>findBy*</code>, dẫn tới assert trên UI chưa cập nhật rồi kết luận sai.","Bật retry của TanStack Query trong test làm test lỗi mất vài giây mới fail, gây chậm và khó đọc log."]},"14.03":{"goals":["Viết E2E Playwright dùng locator có auto-wait để chống flaky thay vì <code>waitForTimeout</code> cứng.","Tái dùng auth state bằng <code>storageState</code> — đăng nhập một lần, các test sau chạy đã login.","Chặn/spy request mạng trong browser để cô lập backend hoặc kiểm tra payload.","Debug lỗi CI bằng trace viewer và bắt regression giao diện bằng visual/screenshot diff.","Chạy test song song và tích hợp vào pipeline CI ổn định."],"tasks":["Viết một flow nghiệp vụ chính (ví dụ đăng nhập → tạo item → thấy item trong danh sách) bằng locator theo role/text với <code>expect(locator).toBeVisible()</code>.","Tạo một setup project đăng nhập một lần rồi lưu <code>storageState</code>, cấu hình các test khác tái dùng state đó qua <code>use: { storageState }</code>.","Dùng <code>page.route()</code> để mock hoặc spy một request và khẳng định app xử lý đúng response bạn kiểm soát.","Bật trace (<code>trace: 'on-first-retry'</code>), cố tình làm hỏng một test, rồi mở trace viewer bằng <code>npx playwright show-trace</code> để chỉ ra bước lỗi.","Cấu hình chạy song song/sharding và một GitHub Actions job chạy suite E2E xanh trong CI."],"hints":["Đừng dùng <code>page.waitForTimeout()</code>; locator của Playwright tự chờ điều kiện — dựa vào <code>expect</code> có retry.","Nếu visual diff flaky do animation, tắt animation bằng <code>animations: 'disabled'</code> trong <code>toHaveScreenshot</code>.","storageState hết hạn thì test sẽ redirect về trang login — kiểm tra token còn hạn và setup project chạy trước.","Trace viewer cho xem DOM snapshot, network và console từng bước; bật <code>trace: 'on-first-retry'</code> để không tốn dung lượng khi mọi thứ xanh."],"crit":["Đã đủ khi: một flow nghiệp vụ chính chạy E2E xanh trong CI, tái dùng auth state, và bạn debug được 1 lỗi bằng trace viewer.","Không còn <code>waitForTimeout</code> cứng — mọi chờ đợi dựa trên auto-wait của locator và <code>expect</code> retry.","Có bằng chứng cụ thể (ảnh chụp/đường dẫn trace) cho bước bạn tìm ra lỗi bằng trace viewer."],"traps":["Selector giòn (bám CSS class hay chuỗi XPath dài) làm test vỡ mỗi lần đổi markup nhỏ.","Đăng nhập lại qua UI ở mỗi test thay vì tái dùng <code>storageState</code>, khiến suite chậm và dễ flaky.","Test phụ thuộc thứ tự hoặc dùng chung dữ liệu, nên chạy song song là hỏng — mỗi test phải tự tạo và dọn data của mình."]},"14.04":{"goals":["Phân biệt testing pyramid và testing trophy, hiểu vì sao FE hiện đại nghiêng về nhiều integration test.","Chọn được tỉ lệ tầng test hợp lý theo bản chất dự án thay vì chạy theo con số coverage.","Truy nguyên và loại bỏ nguồn gốc flaky test: timing, thứ tự chạy, state chung.","Hiểu contract testing để FE và BE khớp API, tránh vỡ khi backend đổi schema.","Quyết định được cái gì đáng test và cái gì KHÔNG nên test (đừng test framework/thư viện)."],"tasks":["Viết một tài liệu chiến lược test cho một dự án cụ thể: nêu tỉ lệ ước tính unit/integration/E2E và lý do chọn trophy hay pyramid.","Liệt kê 3 test flaky (thật hoặc giả định), chỉ ra nguồn gốc (timing/thứ tự/state chung) và cách sửa từng cái.","Chỉ ra trong dự án những phần KHÔNG nên test (ví dụ hành vi của thư viện bên thứ ba, getter tầm thường) và giải thích vì sao.","Phác một contract test hoặc mô tả cách đảm bảo FE và BE khớp API (schema/type dùng chung, snapshot của contract).","Rà một suite chậm giả định và đề xuất cắt giảm: gộp test trùng, đẩy vài E2E xuống integration, chạy song song."],"hints":["Trophy đề cao integration vì nó bắt regression thật với chi phí bảo trì thấp hơn E2E — nhưng đừng bỏ hẳn E2E cho các flow doanh thu chính.","Flaky do thứ tự thường là dấu hiệu state chung chưa reset; chạy suite ở chế độ random order để lộ ra.","Đừng viết test chỉ để đẩy coverage — coverage cao không đồng nghĩa bắt được regression; ưu tiên test hành vi quan trọng.","Contract testing hữu ích khi FE và BE deploy độc lập; nếu dùng chung type (ví dụ sinh type từ OpenAPI) đã giảm rủi ro lệch."],"crit":["Đã đủ khi: đề xuất được chiến lược test cho một dự án (tầng nào bao nhiêu, cái gì không test) và lý giải được lựa chọn.","Mỗi nguồn flaky nêu ra đều có nguyên nhân gốc và cách sửa cụ thể, không chỉ \"chạy lại là qua\".","Ranh giới test/không-test rõ ràng, có lý do dựa trên giá trị bắt regression chứ không dựa vào con số coverage."],"traps":["Đo chất lượng suite bằng % coverage rồi viết test vô nghĩa chỉ để chạm dòng code, không bắt được lỗi thật.","Nhồi quá nhiều E2E cho mọi nhánh nhỏ khiến suite chậm 30 phút, flaky, và không ai muốn chạy.","\"Sửa\" flaky bằng retry hoặc <code>sleep</code> thay vì truy nguồn gốc timing/thứ tự/state chung, khiến vấn đề tích tụ."]},"15.01":{"goals":["Nắm <code>element.animate()</code>, keyframes và timeline để điều khiển animation bằng JS mà vẫn chạy trên compositor.","Điều khiển được vòng đời animation: play/pause/reverse/seek qua đối tượng <code>Animation</code> trả về.","Hiểu và áp dụng kỹ thuật FLIP để animate thay đổi layout mượt mà không reflow mỗi frame.","Biết dùng easing, stagger, spring và khi nào chọn CSS, khi nào WAAPI, khi nào thư viện.","Tôn trọng <code>prefers-reduced-motion</code> để không gây khó chịu cho người nhạy cảm với chuyển động."],"tasks":["Tạo một list có nút thêm/xoá/đảo thứ tự item, rồi animate việc reorder bằng kỹ thuật FLIP (đo vị trí First/Last, tính Invert bằng <code>transform</code>, Play bằng <code>animate()</code>).","Chỉ animate <code>transform</code> và <code>opacity</code>, xác nhận trên DevTools Performance rằng không có layout/reflow trong mỗi frame animation.","Dùng đối tượng <code>Animation</code> trả về từ <code>animate()</code> để gắn nút play/pause/reverse và một thanh seek điều khiển <code>currentTime</code>.","Thêm stagger (trễ tăng dần theo index) cho các item khi vào danh sách, dùng easing tự nhiên thay vì linear.","Bọc toàn bộ animation trong kiểm tra <code>matchMedia('(prefers-reduced-motion: reduce)')</code> để tắt hoặc rút gọn chuyển động khi người dùng yêu cầu."],"hints":["FLIP: đo <code>getBoundingClientRect()</code> trước (First) và sau khi DOM đổi (Last), đặt phần tử về vị trí cũ bằng <code>transform</code> (Invert), rồi animate về <code>transform: none</code> (Play).","Đọc lại vị trí sau khi thay đổi DOM sẽ ép trình duyệt reflow một lần — chấp nhận một lần đo, tránh đo lặp trong loop.","Muốn animation chạy tiếp khi tab ẩn hay nối chuỗi, dùng <code>animation.finished</code> (Promise) thay vì callback lồng nhau.","View Transitions API (<code>document.startViewTransition</code>) là lối tắt cho nhiều FLIP cùng lúc khi chuyển trạng thái/trang."],"crit":["Đã đủ khi: một list reorder animate mượt bằng FLIP và tôn trọng <code>prefers-reduced-motion</code>.","Animation chỉ chạm <code>transform</code>/<code>opacity</code>, không xuất hiện layout thrashing trong Performance panel.","Có điều khiển play/pause/reverse/seek hoạt động đúng qua đối tượng <code>Animation</code>."],"traps":["Animate <code>width</code>/<code>height</code>/<code>top</code>/<code>left</code> thay vì <code>transform</code>, khiến reflow mỗi frame và giật.","Quên bước Invert của FLIP nên phần tử nhảy ngay đến vị trí mới rồi mới animate, tạo hiệu ứng giật.","Bỏ qua <code>prefers-reduced-motion</code> hoặc chỉ giảm thời lượng chứ không thực sự tắt chuyển động lớn."]},"15.02":{"goals":["Hiểu <code>viewBox</code> và hệ toạ độ SVG — gốc rễ của mọi hiểu lầm khi SVG hiển thị sai kích thước.","Đọc và sửa được <code>path</code> bằng tay với các lệnh M/L/C/A.","Animate vẽ nét bằng <code>stroke-dasharray</code>/<code>stroke-dashoffset</code>.","Biết trade-off giữa inline, <code>&lt;img&gt;</code>, background và SVG sprite; tối ưu bằng SVGO.","Đảm bảo a11y cho SVG với <code>title</code>, <code>role</code> và các thuộc tính phù hợp."],"tasks":["Vẽ một icon đơn giản bằng tay chỉ dùng <code>path</code> với lệnh M/L/C, đặt <code>viewBox</code> hợp lý và kiểm tra nó scale sắc nét khi phóng to.","Thử đổi <code>preserveAspectRatio</code> và quan sát icon căn giữa/kéo giãn khác nhau để nắm ý nghĩa từng giá trị.","Làm hiệu ứng \"vẽ nét\": set <code>stroke-dasharray</code> bằng độ dài path, animate <code>stroke-dashoffset</code> từ độ dài đó về 0.","Tạo một SVG sprite (<code>symbol</code> + <code>use</code>) chứa vài icon và chạy SVGO để so sánh kích thước trước/sau tối ưu.","Thêm <code>role=\"img\"</code> và <code>&lt;title&gt;</code> cho icon mang ý nghĩa, đặt <code>aria-hidden=\"true\"</code> cho icon trang trí."],"hints":["Lấy độ dài path bằng <code>path.getTotalLength()</code> để tính chính xác giá trị <code>stroke-dasharray</code>.","<code>viewBox=\"0 0 24 24\"</code> nghĩa là hệ toạ độ nội bộ 24x24; kích thước hiển thị do CSS/thuộc tính width/height quyết định — tách bạch hai khái niệm này.","Lệnh chữ hoa (M/L/C) dùng toạ độ tuyệt đối, chữ thường (m/l/c) dùng tương đối — nhầm là path lệch ngay.","Inline SVG khi cần animate/đổi màu theo state; sprite khi dùng lại nhiều nơi; <code>&lt;img&gt;</code> khi chỉ là ảnh tĩnh không cần can thiệp."],"crit":["Đã đủ khi: đọc/sửa được path SVG bằng tay, làm một icon animate \"vẽ nét\", và biết khi nào inline vs sprite.","Icon sắc nét ở mọi độ phân giải nhờ <code>viewBox</code> đặt đúng, không bị mờ/vỡ khi phóng to.","SVG có a11y phù hợp: icon ý nghĩa có nhãn, icon trang trí bị ẩn khỏi trợ năng."],"traps":["Nhầm <code>width</code>/<code>height</code> với <code>viewBox</code>, khiến SVG bị crop hoặc scale sai.","Đặt <code>stroke-dasharray</code> cố định không khớp độ dài path thật, làm hiệu ứng vẽ nét bị đứt hoặc thừa.","Inline hàng loạt icon lớn vào mọi component gây phình HTML thay vì dùng sprite tái sử dụng."]},"15.03":{"goals":["Vẽ shape/text/image, dùng transform và dựng vòng lặp animation bằng <code>requestAnimationFrame</code>.","Xử lý ảnh client-side: vẽ ảnh lên canvas, đọc/sửa pixel bằng <code>getImageData</code>, resize/crop/filter.","Export kết quả ra blob để tải lên hoặc lưu.","Phân biệt Canvas (immediate mode) vs SVG (retained mode) và biết chọn cái nào theo bài toán.","Biết dùng <code>OffscreenCanvas</code> + Worker cho vẽ nặng và định hướng WebGL/WebGPU."],"tasks":["Dựng một visualization động (ví dụ particle hoặc biểu đồ real-time) vẽ bằng Canvas 2D trong vòng lặp <code>requestAnimationFrame</code>, clear và vẽ lại mỗi frame.","Nạp một ảnh vào canvas bằng <code>drawImage</code>, resize xuống kích thước nhỏ hơn, rồi export bằng <code>canvas.toBlob()</code> với chất lượng nén tuỳ chọn.","Dùng <code>getImageData</code>/<code>putImageData</code> để áp một filter đơn giản (grayscale hoặc invert) bằng cách sửa mảng pixel.","Đo và tính delta time giữa các frame để chuyển động ổn định theo thời gian thực chứ không phụ thuộc tốc độ frame.","So sánh chi phí render cùng một cảnh bằng Canvas và bằng nhiều phần tử SVG/DOM để tự rút ra ngưỡng nên dùng Canvas."],"hints":["Nhớ nhân kích thước canvas với <code>devicePixelRatio</code> và scale context tương ứng để nét trên màn Retina.","Luôn <code>clearRect</code> hoặc vẽ nền lại đầu mỗi frame, nếu không các frame cũ chồng lên nhau.","Ảnh khác origin không có CORS sẽ làm canvas \"taint\" và <code>getImageData</code>/<code>toBlob</code> ném lỗi bảo mật.","Chuyển vòng lặp vẽ nặng sang <code>OffscreenCanvas</code> trong Worker để không chặn main thread."],"crit":["Đã đủ khi: vẽ được một visualization động bằng canvas với rAF loop, và resize/nén một ảnh phía client bằng canvas.","Chuyển động dùng delta time nên mượt và nhất quán ở các tốc độ frame khác nhau.","Ảnh export ra blob đúng kích thước/định dạng mong muốn và tải/lưu được."],"traps":["Dùng <code>setInterval</code> thay vì <code>requestAnimationFrame</code>, gây lệch nhịp vẽ và tốn pin khi tab ẩn.","Bỏ qua <code>devicePixelRatio</code> khiến canvas mờ trên màn hình mật độ cao.","Đọc pixel từ ảnh cross-origin không CORS rồi vướng lỗi tainted canvas mà không hiểu nguyên nhân."]},"15.04":{"goals":["Xử lý lỗi tải ảnh bằng <code>onerror</code> để thay ảnh fallback/placeholder, tránh icon vỡ.","Dựng quick display: LQIP/blur-up, BlurHash hoặc dominant-color để lấp khoảng trống và chống CLS.","Kết hợp lazy load với <code>fetchpriority</code> và <code>decoding=\"async\"</code>; dùng skeleton và preload ảnh quan trọng.","Phục vụ ảnh responsive theo DPR và <code>sizes</code>, với fallback định dạng AVIF → WebP → JPEG.","Đảm bảo một ảnh production-grade: hiện ngay, lazy đúng lúc, không gây dịch layout."],"tasks":["Thêm handler <code>onerror</code> cho ảnh để chuyển sang ảnh fallback/placeholder khi tải lỗi, có tránh vòng lặp lỗi vô hạn.","Cài blur-up: hiển thị một ảnh mờ nhẹ (LQIP inline base64 hoặc dominant-color) ngay lập tức rồi thay bằng ảnh nét khi tải xong.","Đặt <code>width</code>/<code>height</code> hoặc <code>aspect-ratio</code> cho khung ảnh để giữ chỗ, đo CLS trên Lighthouse và xác nhận bằng 0 hoặc gần 0.","Cấu hình <code>loading=\"lazy\"</code>, <code>decoding=\"async\"</code> cho ảnh ngoài viewport và <code>fetchpriority=\"high\"</code> cho ảnh hero quan trọng.","Dùng <code>&lt;picture&gt;</code> với các nguồn AVIF → WebP → JPEG kèm <code>srcset</code>/<code>sizes</code> để trình duyệt chọn định dạng và độ phân giải tối ưu."],"hints":["Trong <code>onerror</code>, gỡ handler hoặc đặt cờ trước khi đổi <code>src</code> để tránh lặp vô hạn nếu ảnh fallback cũng lỗi.","Giữ chỗ bằng <code>aspect-ratio</code> hoặc thuộc tính <code>width</code>/<code>height</code> là cách chống CLS rẻ và chắc nhất.","LQIP nhỏ vài trăm byte nhúng thẳng base64 sẽ hiện tức thì mà không tốn thêm request.","Chỉ đặt <code>fetchpriority=\"high\"</code> cho ảnh LCP; đặt cho mọi ảnh sẽ triệt tiêu tác dụng ưu tiên."],"crit":["Đã đủ khi: một ảnh có placeholder blur hiện ngay, lazy load ngoài viewport, fallback khi lỗi, và không gây CLS.","Khung ảnh giữ chỗ đúng tỉ lệ nên điểm CLS bằng 0 hoặc gần 0 trên Lighthouse.","Trình duyệt tự chọn định dạng/độ phân giải tối ưu qua <code>&lt;picture&gt;</code> và <code>srcset</code>/<code>sizes</code>."],"traps":["Không set kích thước/aspect-ratio cho ảnh lazy, khiến ảnh \"bụp\" ra và đẩy layout gây CLS.","Handler <code>onerror</code> trỏ tới ảnh fallback cũng lỗi mà không có cờ chặn, tạo vòng lặp lỗi.","Đặt <code>loading=\"lazy\"</code> cho cả ảnh hero/LCP làm chậm hiển thị nội dung chính."]},"16.01":{"goals":["Phân biệt được mô hình kết nối của HTTP/1.1, HTTP/2 và HTTP/3 và tác động của từng đời lên chiến lược loading.","Hiểu head-of-line blocking xảy ra ở đâu (tầng ứng dụng vs tầng transport) và mỗi đời giải quyết thế nào.","Nắm vì sao multiplexing của HTTP/2 làm giảm nhu cầu bundle/sprite/domain-sharding cực đoan.","Giải thích được lợi thế của HTTP/3 (QUIC over UDP) cho người dùng mobile hay đổi mạng."],"tasks":["Mở tab Network trong DevTools, bật cột Protocol (chuột phải header) và ghi lại giao thức thực tế (h2, h3, http/1.1) mà một site lớn trả về cho các asset.","Chạy <code>curl -sI --http2 https://example.com</code> và <code>curl -sI --http3 https://example.com</code> để xác nhận server hỗ trợ đời nào, đọc header <code>alt-svc</code> để thấy quảng bá HTTP/3.","Tự phục vụ một trang có 30 ảnh nhỏ, đo tổng thời gian tải trên HTTP/1.1 và HTTP/2, so sánh số kết nối TCP mở ra ở cột Connection ID.","Viết một đoạn giải thích 5-7 dòng: với HTTP/2, gộp 30 ảnh thành 1 sprite lợi/hại gì so với để rời và tận dụng multiplexing.","Mô phỏng đổi mạng (tắt/bật wifi khi đang tải trên trang HTTP/3) và ghi nhận hành vi kết nối lại so với HTTP/2."],"hints":["Nếu cột Protocol trống, site có thể đang ở HTTP/1.1 hoặc bị proxy/dev-server can thiệp — thử site production lớn để thấy h2/h3.","HTTP/3 dùng UDP nên đôi khi bị firewall doanh nghiệp chặn, làm trình duyệt tự lùi về h2 — đừng nhầm là trình duyệt không hỗ trợ.","Head-of-line blocking của HTTP/2 vẫn còn ở tầng TCP (một gói mất chặn cả stream); HTTP/3 chuyển sang QUIC để né đúng chỗ này.","Server push của HTTP/2 đã bị deprecated — đừng đưa nó vào chiến lược tối ưu mới, thay bằng <code>preload</code>/<code>103 Early Hints</code>."],"crit":["Đã đủ khi bạn giải thích được vì sao 'gộp mọi thứ vào 1 file' không còn tối ưu với HTTP/2 và HTTP/3 lợi gì cho mobile, có dẫn chứng đo được từ DevTools.","Chỉ ra chính xác head-of-line blocking nằm ở tầng nào trong mỗi đời và cơ chế khắc phục tương ứng.","Kết nối được đặc điểm giao thức với quyết định loading thực tế (mức độ bundle, số kết nối, domain-sharding)."],"traps":["Áp lời khuyên thời HTTP/1.1 (bundle tất cả, sprite ảnh, domain-sharding) một cách máy móc lên hạ tầng HTTP/2·3 và làm chậm đi.","Tin rằng HTTP/2 xóa hoàn toàn head-of-line blocking, quên rằng tầng TCP vẫn chặn khi mất gói.","Dựa vào HTTP/2 Server Push cho tối ưu mới trong khi nó đã bị deprecated và gỡ khỏi các trình duyệt."]},"16.02":{"goals":["Đo được năng lực thật của thiết bị/mạng bằng các API phù hợp thay vì đoán theo user-agent.","Thiết kế chiến lược phân phối thích ứng: đổi chất lượng ảnh/video, hoãn tính năng nặng theo mạng yếu.","Áp dụng mobile-first bundle và conditional import để không đẩy code nặng xuống máy yếu.","Kiểm chứng được app tải nhẹ hơn trên 3G/thiết bị yếu bằng số liệu, không chỉ cảm tính."],"tasks":["Đọc <code>navigator.connection.effectiveType</code>, <code>navigator.connection.saveData</code>, <code>navigator.deviceMemory</code>, <code>navigator.hardwareConcurrency</code> và log ra một 'profile năng lực' của thiết bị hiện tại.","Viết logic chọn nguồn ảnh: khi <code>effectiveType</code> là '2g'/'3g' hoặc <code>saveData</code> bật thì trả URL ảnh nhỏ/nén mạnh hơn, ngược lại trả bản chất lượng cao.","Dùng conditional dynamic <code>import()</code> để chỉ tải module tính năng nặng (ví dụ chart/animation) khi thiết bị đủ mạnh; đo lại kích thước JS tải về ở hai nhánh.","Bật throttle Slow 3G và CPU 4x slowdown trong DevTools, đo tổng bytes và thời gian tải trước/sau khi áp adaptive, ghi lại con số cụ thể.","Phục vụ ảnh theo DPR bằng <code>srcset</code>/<code>sizes</code> và giảm hoặc tắt animation khi <code>prefers-reduced-motion</code> hoặc <code>saveData</code> bật."],"hints":["<code>navigator.connection</code> chưa hỗ trợ đồng đều (Safari thiếu) — luôn kiểm tra tồn tại và có nhánh fallback hợp lý thay vì để app vỡ.","<code>effectiveType</code> là ước lượng dựa trên hiệu năng gần đây, không phải loại sóng vật lý — coi nó là gợi ý, kết hợp thêm <code>saveData</code>.","Lắng nghe sự kiện <code>navigator.connection.change</code> để cập nhật chiến lược khi người dùng chuyển 4G↔wifi giữa phiên.","Ưu tiên quyết định phía server bằng Client Hints (<code>Save-Data</code>, <code>Sec-CH-*</code>) để phục vụ đúng biến thể ngay từ request đầu, tránh tải thừa rồi mới đổi."],"crit":["Đã đủ khi app tải nhẹ hơn có kiểm chứng trên mạng 3G/thiết bị yếu (ảnh nhỏ hơn, hoãn phần nặng) và thực sự dùng Network Information API.","Có số liệu trước/sau (bytes, thời gian) chứng minh khác biệt khi throttle, không chỉ mô tả định tính.","Mọi nhánh adaptive đều có fallback an toàn khi API không tồn tại, app không hỏng trên trình duyệt thiếu hỗ trợ."],"traps":["Dùng sniff user-agent để đoán thiết bị thay vì đo năng lực thật, dẫn tới phục vụ sai và khó bảo trì.","Giả định <code>navigator.connection</code> luôn tồn tại nên app ném lỗi trên Safari/iOS.","Chỉ test trên máy dev mạnh + wifi văn phòng rồi kết luận nhanh, không bao giờ bật throttle hay chạm thiết bị thật."]},"16.03":{"goals":["Đồng bộ được trạng thái (auth/logout, theme) giữa nhiều tab cùng origin theo thời gian thực.","Hiểu vai trò của BroadcastChannel so với sự kiện <code>storage</code> và khi nào chọn cái nào.","Nắm luồng thông báo qua Notifications API và Push API khi app đã đóng.","Hiểu Background Sync/Periodic Sync gửi dữ liệu lại khi có mạng trong ngữ cảnh offline-first."],"tasks":["Tạo một <code>BroadcastChannel('auth')</code>, khi logout ở một tab thì <code>postMessage</code> để các tab khác cùng nhận và tự đăng xuất; kiểm thử với 3 tab mở song song.","Làm phiên bản thứ hai dùng sự kiện <code>window.addEventListener('storage', ...)</code> qua <code>localStorage</code>, so sánh độ trễ và giới hạn với BroadcastChannel.","Đăng ký Service Worker rồi xin quyền qua <code>Notification.requestPermission()</code> và hiển thị một notification thử bằng <code>registration.showNotification()</code>.","Vẽ sơ đồ luồng push: client subscribe <code>PushManager</code> lấy endpoint, gửi lên server, server đẩy qua push service, Service Worker nhận sự kiện <code>push</code> và hiện thông báo.","Đồng bộ thêm theme (sáng/tối) giữa các tab qua cùng channel và xác nhận đổi ở một tab lập tức phản ánh ở tab còn lại."],"hints":["BroadcastChannel chỉ hoạt động trong cùng origin và không lưu trạng thái — tab mở sau khi phát tin sẽ không nhận, cần đọc lại nguồn sự thật khi khởi tạo.","Sự kiện <code>storage</code> chỉ bắn ở các tab khác chứ không phải tab vừa ghi — đừng trông đợi tab hiện tại tự nhận.","Push cần HTTPS và một Service Worker đang hoạt động; trên localhost được miễn HTTPS để test.","Đừng nhầm Notifications API (hiển thị) với Push API (nhận dữ liệu đẩy từ server) — chúng thường đi cùng nhưng là hai lớp khác nhau."],"crit":["Đã đủ khi logout ở một tab tự đăng xuất mọi tab qua BroadcastChannel và bạn giải thích được luồng push notification đầu-cuối.","Kiểm chứng đồng bộ hoạt động với ít nhất 3 tab và với cả trường hợp tab mới mở sau sự kiện.","Chỉ ra đúng ranh giới trách nhiệm giữa BroadcastChannel, storage event, Notifications API và Push API."],"traps":["Dùng BroadcastChannel giữa hai origin/subdomain khác nhau và ngạc nhiên vì tin không tới.","Quên khôi phục trạng thái từ nguồn sự thật khi tab mới mở, khiến tab đó lệch với các tab đang chạy.","Tưởng push notification chạy được không cần Service Worker hoặc không cần HTTPS."]},"16.04":{"goals":["Thiết lập quy trình i18n hoàn chỉnh vượt ra ngoài Intl API: tách chuỗi, key, namespace, fallback.","Đổi ngôn ngữ runtime mà chỉ lazy-load đúng locale đang dùng, không tải hết mọi ngôn ngữ.","Dùng ICU message format để xử lý số nhiều (plural), giới tính và biến trong câu đúng ngữ pháp.","Xử lý các cạnh của i18n: RTL, thiếu bản dịch và fallback ngôn ngữ."],"tasks":["Cài <code>react-i18next</code> (hoặc FormatJS), tách các chuỗi hard-code ra file dịch theo namespace và đặt key có ngữ nghĩa thay vì dùng nguyên câu làm key.","Cấu hình lazy-load locale bằng <code>i18next-http-backend</code> hoặc dynamic <code>import()</code>, kiểm tra tab Network chỉ tải file ngôn ngữ đang chọn.","Viết một chuỗi ICU plural (ví dụ <code>{count, plural, one {# mục} other {# mục}}</code>) và test với count = 0, 1, 2 để thấy khác biệt so với nối chuỗi tay.","Thêm cơ chế fallback ngôn ngữ và log/cảnh báo khi thiếu key, rồi cố tình xóa một bản dịch để xác nhận app không vỡ mà rơi về fallback.","Bật một locale RTL (ví dụ tiếng Ả Rập) và kiểm tra <code>dir='rtl'</code> cùng bố cục lật đúng chiều."],"hints":["Đừng dùng nguyên câu tiếng Việt làm key — sửa một chữ là vỡ mọi bản dịch; dùng key ổn định như <code>cart.item_count</code>.","Số nhiều mỗi ngôn ngữ có luật riêng (tiếng Ả Rập tới 6 dạng) — để ICU xử lý, đừng tự viết <code>if count === 1</code>.","Lazy-load locale nghĩa là ngôn ngữ mặc định phải sẵn sàng ngay còn phần còn lại tải theo yêu cầu — cân nhắc preload ngôn ngữ khả năng cao nhất.","RTL không chỉ là <code>direction: rtl</code>; dùng thuộc tính logic (<code>margin-inline-start</code>) thay cho left/right cứng để bố cục tự lật."],"crit":["Đã đủ khi app đổi ngôn ngữ runtime, chỉ tải locale đang dùng, và xử lý đúng số nhiều bằng ICU.","Có bằng chứng ở tab Network rằng chuyển ngôn ngữ chỉ tải thêm file locale tương ứng chứ không tải tất cả.","Thiếu một key/bản dịch thì app rơi về fallback gọn gàng thay vì hiện key thô hoặc lỗi."],"traps":["Nối chuỗi tay để tạo câu số nhiều/giới tính, cho ra ngữ pháp sai ở các ngôn ngữ khác.","Bundle toàn bộ mọi locale vào bản build, làm phình JS dù người dùng chỉ xài một ngôn ngữ.","Dùng câu gốc làm key khiến mọi bản dịch vỡ khi chỉ sửa một từ trong bản gốc."]},"17.01":{"goals":["Giải thích được WASM là bytecode chạy near-native, biên dịch từ Rust/C++/Go, bổ trợ chứ không thay JS.","Phân biệt rõ khi nào tác vụ CPU-bound đáng đưa sang WASM và khi nào KHÔNG (DOM, I/O).","Hiểu cơ chế tương tác JS ↔ WASM: linear memory, truyền dữ liệu, chi phí copy qua biên.","Biết chạy WASM trong Web Worker để không chặn main thread (nối 02.04).","Nhận diện các thư viện WASM thực tế: <code>ffmpeg.wasm</code>, <code>sql.js</code>, image codec."],"tasks":["Chọn một module WASM có sẵn (ví dụ <code>ffmpeg.wasm</code> hoặc <code>sql.js</code>) và load nó vào trang bằng <code>WebAssembly.instantiateStreaming()</code>.","Chạy một tác vụ nặng thực tế qua module đó (ví dụ transcode một clip ngắn hoặc chạy query trên DB SQLite trong bộ nhớ) và log kết quả.","Viết một benchmark so sánh: cùng tác vụ làm bằng JS thuần vs WASM, đo thời gian bằng <code>performance.now()</code> và ghi lại con số.","Chuyển lời gọi WASM vào một Web Worker và dùng <code>postMessage</code> để không đóng băng UI khi tác vụ chạy.","Viết một đoạn ghi chú ngắn nêu 1 trường hợp WASM thắng JS và 1 trường hợp không nên dùng WASM, kèm số liệu benchmark của bạn."],"hints":["Nếu không load được module, kiểm tra server có trả đúng MIME <code>application/wasm</code> không — <code>instantiateStreaming</code> khó tính về header.","Chi phí truyền dữ liệu qua biên JS↔WASM có thể ăn hết lợi ích: với payload nhỏ hoặc tác vụ nhẹ, JS thường vẫn nhanh hơn.","Muốn tránh copy lớn, dùng chung <code>WebAssembly.Memory</code> và đọc/ghi qua <code>Uint8Array</code> trỏ vào linear memory.","Chạy WASM trong Worker thì tải file <code>.wasm</code> ngay trong Worker, đừng truyền instance qua <code>postMessage</code>."],"crit":["Đã đủ khi bạn giải thích được rõ ràng khi nào WASM thắng JS và khi nào không, và chạy được một module WASM có sẵn xử lý một tác vụ nặng.","Có số liệu benchmark cụ thể JS vs WASM cho cùng tác vụ, không nói chung chung.","Tác vụ nặng chạy trong Worker và UI vẫn mượt (cuộn/animation không giật) trong lúc xử lý."],"traps":["Nhảy vào WASM cho tác vụ nhẹ hoặc I/O-bound — phức tạp thừa mà không nhanh hơn, thậm chí chậm hơn vì chi phí qua biên.","Đo benchmark sai: chỉ chạy 1 lần, không warm-up, hoặc quên loại thời gian load module ra khỏi phép đo.","Chạy WASM ngay trên main thread cho tác vụ nặng, khiến UI đóng băng — đúng ra phải đẩy vào Worker."]},"17.02":{"goals":["Giải thích được kiến trúc local-first: nguồn chân lý ở client, server chỉ sync/backup, UX tức thì và chạy offline.","Hiểu CRDT là gì và vì sao nó merge được không cần khoá, khác last-write-wins ở đâu.","Nắm vai trò sync engine, offline queue (nối 03.03) và cập nhật optimistic (nối 07.02).","Dùng được <code>Yjs</code> để tạo shared document tự đồng bộ.","Biết kết nối local-first với IndexedDB (03.01) và Service Worker (03.02) để bền vững offline."],"tasks":["Khởi tạo một <code>Y.Doc</code> với <code>Yjs</code> và bind một cấu trúc dữ liệu (ví dụ <code>Y.Text</code> hoặc <code>Y.Array</code>) vào một ô nhập liệu trên UI.","Dựng demo 2 client (2 tab trình duyệt) cùng sửa một document và dùng một provider (ví dụ <code>y-webrtc</code> hoặc <code>y-websocket</code>) để chúng tự đồng bộ.","Cho 2 client cùng gõ vào một vị trí đồng thời rồi quan sát kết quả merge, xác nhận không mất dữ liệu và không xung đột.","Ngắt mạng một client, sửa offline, rồi bật lại và kiểm tra thay đổi được sync đúng khi có mạng trở lại.","Persist state bằng <code>y-indexeddb</code> để reload trang vẫn giữ nội dung, và viết ghi chú ngắn giải thích vì sao CRDT merge không xung đột."],"hints":["Đừng tự viết logic merge — để Yjs lo. Việc của bạn là bind CRDT type vào UI và lắng nghe sự kiện <code>observe</code>.","Nếu 2 tab không thấy nhau, kiểm tra provider: <code>y-webrtc</code> cần signaling server, còn <code>y-websocket</code> cần một server đang chạy.","So sánh trực giác: last-write-wins vứt bỏ một bên khi trùng thời điểm, CRDT giữ cả hai và hợp nhất theo quy tắc xác định.","Thêm <code>y-indexeddb</code> để offline queue trở nên miễn phí — thay đổi lưu local rồi flush khi provider kết nối lại."],"crit":["Đã đủ khi bạn giải thích được vì sao CRDT merge không xung đột, và dựng được demo 2 client sửa cùng một document tự đồng bộ bằng Yjs.","Sửa offline rồi online lại thì thay đổi hai bên hòa vào nhau đúng, không mất và không đè.","State được persist local nên reload trang vẫn giữ nội dung mà không cần gọi server."],"traps":["Nhảy vào CRDT khi bài toán chưa cần cộng tác realtime — với form đơn giản thì đây là phức tạp thừa, một REST API là đủ.","Tự cài đặt resolve xung đột bằng tay bên trên CRDT, phá vỡ tính hội tụ mà Yjs đảm bảo.","Coi server là nguồn chân lý và ép client đợi server, làm mất đúng cái lợi UX tức thì của local-first."]},"17.03":{"goals":["Hiểu feature flags: bật/tắt tính năng lúc runtime, canary/gradual rollout, kill switch mà không cần deploy lại.","Nắm nguyên lý A/B testing: chia nhóm, đo lường, và tránh làm hỏng CLS/perf khi thí nghiệm.","Biết thiết kế event tracking có chủ đích, tôn trọng privacy: consent và không gửi PII (nối 05.02).","Kết nối đo lường sản phẩm với RUM (nối 05.04) để nhìn cả hành vi lẫn hiệu năng.","Hiểu vì sao phân phối an toàn (gradual rollout) giảm rủi ro so với ship 100% ngay."],"tasks":["Tích hợp một feature flag (tự viết đơn giản hoặc dùng SDK như LaunchDarkly/Unleash) và gate một tính năng sau flag đó.","Cấu hình gradual rollout cho flag: bật cho một tỷ lệ user (ví dụ 10%) và xác nhận phần còn lại không thấy tính năng.","Thêm một kill switch: tắt flag và kiểm tra tính năng biến mất ngay mà không cần deploy lại.","Đặt một event tracking cho một hành động chủ đích (ví dụ click nút chính), có cơ chế consent và loại bỏ mọi PII trước khi gửi.","Chạy một thí nghiệm A/B nhỏ chia 2 nhánh UI và kiểm tra không gây layout shift bằng cách theo dõi CLS trong Lighthouse hoặc RUM."],"hints":["Đánh giá flag phải nhanh và có giá trị mặc định an toàn — nếu service flag lỗi, tính năng nên coi như tắt (fail closed).","Tránh CLS trong A/B: dựng sẵn khung/kích thước ổn định cho cả hai nhánh, đừng render nhánh này rồi nhảy sang nhánh kia.","Trước khi gửi event, rà lại payload: bỏ email, tên, id nhạy cảm; chỉ gửi cái bạn thật sự cần để trả lời một câu hỏi cụ thể.","Kiểm tra kill switch bằng cách tắt flag trên dashboard rồi refresh — không được phải build lại hay deploy."],"crit":["Đã đủ khi bạn gate được một tính năng sau feature flag với gradual rollout, và đặt được event tracking tôn trọng privacy.","Kill switch tắt tính năng ngay lập tức mà không cần deploy lại, và mặc định an toàn khi flag service lỗi.","Event tracking chỉ chạy sau khi có consent và không có PII nào trong payload gửi đi."],"traps":["Ship tính năng cho 100% user ngay thay vì canary/gradual rollout, mất luôn cơ hội phát hiện lỗi sớm.","Thí nghiệm A/B render nhánh sau khi trang đã tải xong, gây layout shift và làm hỏng CLS/perf.","Gửi event kèm PII hoặc bắn tracking trước khi có consent, vi phạm privacy (nối 05.02)."]},"18.01":{"goals":["Hiểu Web App Manifest và các trường bắt buộc để app cài được lên home screen.","Nắm điều kiện installable: manifest hợp lệ, Service Worker đã đăng ký, phục vụ qua HTTPS.","Biết cách tự điều khiển nút cài đặt bằng sự kiện <code>beforeinstallprompt</code>.","Đọc và hiểu report Lighthouse PWA để biết còn thiếu gì.","Nhận diện giới hạn của iOS/Safari để thiết kế fallback thay vì tin PWA đồng nhất mọi nền tảng."],"tasks":["Tạo file <code>manifest.webmanifest</code> đầy đủ <code>name</code>, <code>short_name</code>, <code>start_url</code>, <code>display: standalone</code>, <code>theme_color</code>, <code>background_color</code> và link nó vào HTML bằng <code>&lt;link rel=\"manifest\"&gt;</code>.","Chuẩn bị bộ icon 192x192, 512x512 và ít nhất một icon <code>purpose: \"maskable\"</code>, khai báo đúng trong mảng <code>icons</code>.","Đăng ký một Service Worker tối thiểu (chỉ cần <code>install</code>/<code>fetch</code> rỗng cũng được) để thỏa điều kiện installable, phục vụ site qua HTTPS hoặc <code>localhost</code>.","Bắt sự kiện <code>beforeinstallprompt</code>, chặn prompt mặc định, lưu event và hiện nút cài đặt tùy biến gọi <code>prompt()</code> khi người dùng bấm.","Chạy Lighthouse PWA audit, cài thử app lên home screen Android, và ghi lại danh sách những thứ iOS/Safari không hỗ trợ."],"hints":["Nếu nút cài không xuất hiện, mở DevTools > Application > Manifest để xem lỗi trường hoặc icon; installability yêu cầu đủ manifest + SW + HTTPS.","Icon maskable phải chừa vùng safe zone ở giữa, nếu không icon sẽ bị cắt góc trên Android; kiểm bằng công cụ maskable preview.","iOS không phát <code>beforeinstallprompt</code>; hãy hướng dẫn người dùng thao tác \"Add to Home Screen\" thủ công thay vì chờ prompt.","<code>start_url</code> nên có tham số để phân biệt lượt mở từ app đã cài, ví dụ <code>?source=pwa</code>."],"crit":["App qua được Lighthouse PWA audit, cài được lên home screen Android và mở ra ở chế độ standalone (không thanh địa chỉ).","Nút cài đặt tùy biến hoạt động đúng qua <code>beforeinstallprompt</code>, và bạn giải thích được vì sao nút này không xuất hiện trên iOS.","Bạn liệt kê rõ những gì iOS/Safari thiếu (không install prompt, storage bị giới hạn, push muộn) và đã có hướng fallback tương ứng."],"traps":["Thiếu icon maskable hoặc thiếu kích thước 512x512 khiến installability fail dù manifest \"trông\" đủ.","Tin rằng PWA chạy giống hệt nhau mọi nền tảng, không xử lý riêng cho iOS nên trải nghiệm gãy trên iPhone.","Quên chặn prompt mặc định rồi lưu event, dẫn tới không thể hiện nút cài đúng thời điểm người dùng muốn."]},"18.02":{"goals":["Hiểu offline là quyết định kiến trúc dữ liệu, không phải công tắc bật cho có.","Xây được ma trận \"loại dữ liệu → chiến lược\" để quyết cái gì nên và không nên offline.","Phân biệt và áp dụng đúng cache-first, stale-while-revalidate, network-first cho từng loại tài nguyên.","Dựng offline queue cho mutation rồi tự đồng bộ bằng Background Sync khi có mạng, không mất và không trùng.","Nhận diện dữ liệu nguy hiểm (tài chính real-time, thanh toán) và chặn thao tác khi offline."],"tasks":["Viết ra ma trận offline cho app của bạn: liệt kê từng loại dữ liệu và đánh dấu nên/không nên offline kèm chiến lược tương ứng.","Precache app shell (HTML/CSS/JS có hash trong tên) theo <code>cache-first</code> bằng Cache API, và dùng <code>network-first</code> cho navigation để không kẹt bản cũ.","Cài <code>stale-while-revalidate</code> cho dữ liệu đọc (list/profile) và lưu kèm timestamp trong IndexedDB để hiển thị cảnh báo \"dữ liệu cũ\".","Dựng offline queue trong IndexedDB cho một mutation tạo mới, đăng ký Background Sync để gửi lên server khi online trở lại.","Chặn hoàn toàn thao
