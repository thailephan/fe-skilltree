 tác thanh toán/không idempotent khi offline và hiển thị trạng thái \"cần mạng\" cho dữ liệu tài chính real-time."],"hints":["Đặt idempotency key cho mỗi mutation trong queue để server nhận diện và bỏ bản trùng khi sync lặp lại.","Optimistic UI: hiện kết quả ngay khi offline rồi reconcile khi sync; nếu xung đột, chọn last-write-wins hoặc CRDT (nối 17.02).","Nếu bản mới không về được sau deploy, kiểm tra navigation có đang dùng cache-first thay vì network-first hay không.","Giới hạn dung lượng cache ảnh/static và dọn bớt để tránh trình duyệt evict cả app shell."],"crit":["Bạn có ma trận offline rõ ràng cho app, mỗi loại dữ liệu gắn đúng chiến lược và lý do.","Đã đủ khi một mutation tạo mới lúc offline được queue lại rồi tự sync khi online mà không mất và không trùng bản ghi.","Thao tác thanh toán/không idempotent bị chặn khi offline, còn dữ liệu tài chính real-time luôn đi network và báo trạng thái \"cần mạng\"."],"traps":["Offline nhầm dữ liệu tài chính hoặc thanh toán, dẫn tới hiển thị số liệu cũ hoặc gửi giao dịch trùng.","Dùng cache-first cho navigation khiến người dùng kẹt ở bản HTML cũ sau khi deploy.","Queue mutation nhưng không có idempotency key, nên retry lúc sync tạo ra bản ghi lặp."]},"18.03":{"goals":["Nắm 4 đường đưa web codebase thành app: PWA/TWA, Capacitor/Ionic, React Native/Expo, Tauri/Electron.","Hiểu trade-off của từng đường về mức tái dùng code, truy cập native, hiệu năng UI và store policy.","Biết khi nào cần native thật và khi nào một WebView shell là đủ.","Chọn được đường ship phù hợp với yêu cầu cụ thể và kỹ năng team.","Lý giải được đánh đổi của lựa chọn thay vì chọn theo hype."],"tasks":["Lập bảng so sánh 4 lựa chọn theo các cột: mức tái dùng code, truy cập native API, hiệu năng UI, lên được store nào, chi phí.","Với PWA/TWA: ghi rõ TWA đưa PWA lên Play Store thế nào và vì sao iOS khó lên store bằng đường này.","Với Capacitor/Ionic: nêu cách bọc web app thành native shell để truy cập camera/contacts và lên được cả 2 store với ~100% code web tái dùng.","Với React Native/Expo: giải thích chia sẻ được logic/JS nhưng không chia sẻ DOM/CSS, nên phải viết lại UI.","Cho một yêu cầu cụ thể (ví dụ \"app đặt hàng cần camera quét QR, lên cả 2 store\"), chọn một đường ship và viết đoạn lý giải trade-off."],"hints":["Câu hỏi lọc đầu tiên: cần bao nhiêu native? Nếu chủ yếu là web UI và ít native, Capacitor thường rẻ và nhanh nhất.","Cần hiệu năng UI native cao và team quen React thì cân nhắc React Native/Expo, nhưng chấp nhận viết lại UI.","Với desktop, ưu tiên Tauri vì bundle nhẹ hơn Electron nhiều nếu không cần hệ sinh thái Node đầy đủ.","Đọc kỹ store policy: PWA thuần khó lên App Store, còn TWA có ràng buộc Digital Asset Links để verify domain."],"crit":["Bạn phân biệt được rõ 4 lựa chọn và trade-off của mỗi cái về code sharing, native, hiệu năng, store.","Đã đủ khi cho một yêu cầu cụ thể bạn chọn được đúng một đường ship và lý giải được trade-off dẫn tới lựa chọn đó.","Lựa chọn của bạn có tính đến store policy và kỹ năng hiện có của team, không chỉ đặc điểm kỹ thuật."],"traps":["Chọn React Native rồi kỳ vọng tái dùng luôn DOM/CSS, dẫn tới ước lượng sai công sức viết lại UI.","Định đưa PWA thuần lên App Store mà bỏ qua việc iOS gần như chặn đường này.","Chọn Electron cho một app desktop nhỏ và gánh bundle nặng trong khi Tauri thừa sức đáp ứng."]},"18.04":{"goals":["Hiểu kiến trúc Manifest V3: background là service worker, content scripts, action/popup, permissions.","Nắm cách giao tiếp giữa content script, background và popup qua message passing.","Biết dùng <code>chrome.storage</code> để lưu trạng thái và vượt CORS có kiểm soát từ background.","Áp dụng lại kiến thức FE (React/Vite, bundling, CSP nghiêm ngặt) vào môi trường extension.","Xin quyền tối thiểu và tuân publish/review policy của store."],"tasks":["Viết <code>manifest.json</code> theo Manifest V3 khai báo <code>background.service_worker</code>, <code>content_scripts</code>, <code>action</code> (popup) và <code>permissions</code> ở mức tối thiểu.","Dựng popup UI bằng React/Vite và bundle ra file tĩnh, đảm bảo CSP nghiêm ngặt, không dùng <code>eval</code>.","Viết content script chèn hoặc sửa nội dung một trang web thật để kiểm chứng nó chạy trong ngữ cảnh trang.","Thiết lập message passing: popup gửi lệnh xuống content script qua background, nhận kết quả trả về và cập nhật UI.","Lưu một mẩu trạng thái bằng <code>chrome.storage</code> và đọc lại được sau khi đóng/mở lại popup."],"hints":["Service worker của MV3 có thể bị kill bất kỳ lúc nào; đừng giữ state trong biến toàn cục, hãy dùng <code>chrome.storage</code>.","Content script và popup không gọi trực tiếp nhau; định tuyến message qua background bằng <code>chrome.runtime.sendMessage</code> và <code>chrome.tabs.sendMessage</code>.","Nếu popup không hiện đúng, kiểm tra CSP trong manifest và đảm bảo asset đã bundle nội bộ, không load script từ CDN ngoài.","Xin đúng quyền cần dùng; permissions thừa sẽ bị review store soi và làm người dùng ngần ngại cài."],"crit":["Extension load được vào trình duyệt và popup mở ra hiển thị UI đúng.","Đã đủ khi extension chạy được đầy đủ ba phần: popup (UI), content script (chèn/sửa trang) và message passing hoạt động giữa chúng.","Manifest xin quyền tối thiểu, dùng CSP nghiêm ngặt và không có <code>eval</code>, sẵn sàng cho review policy của store."],"traps":["Giữ trạng thái trong biến toàn cục của service worker rồi mất sạch khi worker bị kill.","Cho content script gọi thẳng popup (hoặc ngược lại) thay vì định tuyến message qua background.","Xin permissions quá rộng hoặc dùng <code>eval</code>/script ngoài, khiến extension vướng CSP và bị store từ chối."]}}; /* FULL_L23_DATA */
const flatLessons = [];
PHASES.forEach((p, pi) => {
  p.level = pi <= 5 ? 1 : pi <= 11 ? 2 : 3;
  p.lessons.forEach((l, li) => {
    l.id = "p" + pi + "-" + li; l.pi = pi; l.li = li; l.color = p.color; l.soft = p.soft; l.phaseTitle = p.title; l.phaseNum = p.num; l.level = p.level;
    if (FULL_L23[l.n]) { Object.assign(l, FULL_L23[l.n]); delete l.need; delete l.done; }
    flatLessons.push(l);
  });
});
const TOTAL = flatLessons.length;

/* ---------- Sidebar render ---------- */
const nav = document.getElementById("nav");
function buildNav(){
  nav.innerHTML = "";
  const LEVEL_LABEL = {1:"Level 1 · Nền tảng", 2:"Level 2 · Kiến trúc", 3:"Level 3 · Chuyên sâu"};
  let lastLevel = 0;
  PHASES.forEach((p, pi) => {
    if (p.level !== lastLevel) {
      lastLevel = p.level;
      const h = document.createElement("div");
      h.className = "nav-level";
      h.textContent = LEVEL_LABEL[p.level];
      nav.appendChild(h);
    }
    const item = document.createElement("div");
    item.className = "nav-item"; item.dataset.pi = pi;
    item.style.setProperty("--pc", p.color);
    item.style.setProperty("--pc-soft", p.soft);
    const btn = document.createElement("button");
    btn.className = "phase-btn";
    btn.innerHTML = `<span class="dot"></span><span class="pt">${p.title}</span><span class="pn">${p.num}</span>
      <span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></span>`;
    btn.onclick = () => item.classList.toggle("open");
    const ll = document.createElement("div");
    ll.className = "lessons";
    p.lessons.forEach((l, li) => {
      const lb = document.createElement("button");
      lb.className = "lesson-btn" + (doneMap[l.id] ? " done" : "");
      lb.dataset.id = l.id;
      lb.dataset.search = (l.title + " " + l.n).toLowerCase();
      lb.innerHTML = `<span class="ln">${l.n}</span><span class="lt">${l.title}</span>
        <span class="check">${CHECK_SM}</span>`;
      lb.onclick = () => { openLesson(l.id); if (window.innerWidth <= 900) closeNav(); };
      ll.appendChild(lb);
    });
    item.appendChild(btn); item.appendChild(ll);
    nav.appendChild(item);
  });
}

function updateProgress(){
  const n = Object.values(doneMap).filter(Boolean).length;
  document.getElementById("progText").textContent = n + "/" + TOTAL + " bài";
  document.getElementById("progBar").style.width = (n / TOTAL * 100) + "%";
}

/* ---------- Content render ---------- */
const content = document.getElementById("content");
let currentId = null;

function setAccent(color, soft){
  document.documentElement.style.setProperty("--accent", color);
  document.documentElement.style.setProperty("--accent-soft", soft);
}

function esc(s){ return s; } // content is trusted, authored inline

function block(icon, color, label, inner){
  return `<section class="block"><div class="block-head">
      <span class="block-ico" style="background:${color}">${icon}</span>
      <h3>${label}</h3></div>${inner}</section>`;
}

function openLesson(id){
  const idx = flatLessons.findIndex(l => l.id === id);
  const l = flatLessons[idx];
  if (!l) return;
  currentId = id;
  setAccent(l.color, l.soft);

  document.querySelectorAll(".lesson-btn").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const item = nav.querySelector('.nav-item[data-pi="' + l.pi + '"]');
  if (item) item.classList.add("open");

  const isBrief = Array.isArray(l.need);
  let bodyHtml;
  if (isBrief) {
    bodyHtml =
      block(ICON.ctx, l.color, "Bối cảnh", `<div class="context">${l.ctx}</div>`) +
      block(ICON.goal, l.color, "Cần nắm", `<ul class="clean">${l.need.map(g=>`<li>${g}</li>`).join("")}</ul>`) +
      block(ICON.crit, l.color, "Đã đủ khi", `<div class="donebox">${l.done}</div>`);
  } else {
    const critState = critMap[id] || {};
    const crit = l.crit.map((c, i) =>
      `<label><input type="checkbox" data-i="${i}" ${critState[i] ? "checked" : ""}>
         <span class="box">${CHECK}</span><span class="txt">${c}</span></label>`).join("");
    bodyHtml =
      block(ICON.ctx, l.color, "Bối cảnh", `<div class="context">${l.ctx}</div>`) +
      block(ICON.goal, l.color, "Mục tiêu", `<ul class="clean">${l.goals.map(g=>`<li>${g}</li>`).join("")}</ul>`) +
      block(ICON.task, l.color, "Nhiệm vụ", `<ol class="tasks">${l.tasks.map(t=>`<li>${t}</li>`).join("")}</ol>`) +
      block(ICON.hint, l.color, "Gợi ý", `<div class="hints"><ul>${l.hints.map(h=>`<li>${h}</li>`).join("")}</ul></div>`) +
      block(ICON.crit, l.color, "Tiêu chí hoàn thành", `<div class="crit">${crit}</div>`) +
      block(ICON.trap, "var(--warn)", "Bẫy thường gặp", `<div class="traps"><ul>${l.traps.map(t=>`<li>${t}</li>`).join("")}</ul></div>`);
  }

  const prev = flatLessons[idx - 1], next = flatLessons[idx + 1];
  const navHtml = `<div class="lesson-nav">
      <a class="prev ${prev ? "" : "disabled"}" ${prev ? `data-go="${prev.id}"` : ""}>
        <div class="dir">← Bài trước</div><div class="nm">${prev ? prev.n + " " + prev.title : ""}</div></a>
      <a class="next ${next ? "" : "disabled"}" ${next ? `data-go="${next.id}"` : ""}>
        <div class="dir">Bài sau →</div><div class="nm">${next ? next.n + " " + next.title : ""}</div></a>
    </div>`;

  const isDone = !!doneMap[id];
  content.className = "content fade";
  content.innerHTML = `
    <div class="lh-kicker"><span class="dot"></span>Level ${l.level} · Phase ${l.phaseNum} · ${l.phaseTitle} · Bài ${l.n}</div>
    <h2 class="lh-title">${l.title}</h2>
    ${bodyHtml}
    <div class="mark-done ${isDone ? "is-done" : ""}">
      <button id="doneBtn">${isDone ? "✓ Đã hoàn thành" : "Đánh dấu đã hoàn thành"}</button>
      <span class="hint">Tiến độ lưu tại trình duyệt của bạn.</span>
    </div>
    ${navHtml}`;

  content.querySelectorAll(".crit input").forEach(inp => {
    inp.onchange = () => {
      const cs = critMap[id] || {}; cs[inp.dataset.i] = inp.checked; critMap[id] = cs; save(KEY_CRIT, critMap);
    };
  });
  document.getElementById("doneBtn").onclick = () => {
    doneMap[id] = !doneMap[id]; save(KEY_DONE, doneMap);
    const lb = nav.querySelector('.lesson-btn[data-id="' + id + '"]');
    if (lb) lb.classList.toggle("done", !!doneMap[id]);
    updateProgress(); openLesson(id);
  };
  content.querySelectorAll("[data-go]").forEach(a => a.onclick = () => openLesson(a.dataset.go));
  window.scrollTo(0, 0);
  document.querySelector(".main").scrollTop = 0;
}

/* ---------- Home ---------- */
function openHome(){
  currentId = null;
  setAccent("#6366f1", "#eef0fe");
  document.querySelectorAll(".lesson-btn").forEach(b => b.classList.remove("active"));
  content.className = "content fade";
  content.innerHTML = `
    <div class="hero">
      <div class="hero-kicker">Lộ trình từ Mid · 4 năm → Senior · tư duy 10 năm</div>
      <h2>Hiểu <span class="grad">browser</span> trước,<br>framework sau.</h2>
      <p>${TOTAL} bài qua ${PHASES.length} phase · 3 level (Nền tảng → Kiến trúc → Chuyên sâu). Mỗi bài là một tình huống thật: bối cảnh → mục tiêu/cần nắm → nhiệm vụ → tiêu chí. Chọn một bài ở thanh bên để bắt đầu.</p>
    </div>
    <div class="rules">
      ${RULES.map(r=>`<div class="rule"><div class="n">${r[0]}</div><div class="t">${r[1]}</div><div class="d">${r[2]}</div></div>`).join("")}
    </div>
    ${[1,2,3].map(lv => `
      <div class="section-title">Level ${lv} · ${({1:"Nền tảng browser & performance",2:"Kiến trúc & quy mô",3:"Chuyên sâu & đa nền tảng"})[lv]}</div>
      <div class="phase-grid">
        ${PHASES.map((p,pi)=>({p,pi})).filter(x=>x.p.level===lv).map(({p,pi})=>`<div class="pcard" style="--pc:${p.color}" data-pi="${pi}">
          <div class="pnum">PHASE ${p.num}</div>
          <h3>${p.title}</h3>
          <div class="sub">${p.sub}</div>
          <div class="cnt">${p.lessons.length} bài →</div>
        </div>`).join("")}
      </div>`).join("")}
    <div class="section-title">Dự án xương sống</div>
    <div class="proj">
      <h3>Real-time Offline-first Dashboard</h3>
      <p>Một dự án đi xuyên suốt 6 phase. Mỗi milestone áp dụng đúng kiến thức phase tương ứng — cuối lộ trình bạn có một sản phẩm portfolio chứng minh được tất cả.</p>
      <div class="ms">${MILESTONES.map(m=>`<div class="ms-row"><span class="mn">${m[0]}</span><span class="md">${m[1]}</span></div>`).join("")}</div>
    </div>`;
  content.querySelectorAll(".pcard").forEach(c => c.onclick = () => {
    const pi = c.dataset.pi;
    const item = nav.querySelector('.nav-item[data-pi="' + pi + '"]');
    if (item){ item.classList.add("open"); openLesson("p" + pi + "-0"); }
    if (window.innerWidth <= 900) closeNav();
  });
  window.scrollTo(0, 0);
}

/* ---------- Search ---------- */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  nav.querySelectorAll(".nav-level").forEach(h => { h.style.display = q ? "none" : ""; });
  nav.querySelectorAll(".nav-item").forEach(item => {
    let anyVisible = false;
    item.querySelectorAll(".lesson-btn").forEach(lb => {
      const match = !q || lb.dataset.search.includes(q);
      lb.style.display = match ? "" : "none";
      if (match) anyVisible = true;
    });
    item.style.display = anyVisible ? "" : "none";
    if (q && anyVisible) item.classList.add("open");
  });
});

/* ---------- Mobile nav ---------- */
const app = document.getElementById("app");
function openNav(){ app.classList.add("nav-open"); }
function closeNav(){ app.classList.remove("nav-open"); }
document.getElementById("hamburger").onclick = openNav;
document.getElementById("backdrop").onclick = closeNav;
document.getElementById("homeLink").onclick = () => { openHome(); if (window.innerWidth <= 900) closeNav(); };

/* ---------- Init ---------- */
buildNav();
updateProgress();
openHome();

/* ---------- PWA: đăng ký Service Worker (no-op nơi không hỗ trợ / bị chặn) ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
